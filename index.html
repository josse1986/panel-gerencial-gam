        <div className="flex-1" />
        <div className="px-4 py-3" style={{ borderTop: "1px solid var(--ink-800)" }}>
          {syncStatus.error ? (
            <p className="text-xs mb-2" style={{ color: COLORS.amber }}>{syncStatus.error}</p>
          ) : (
            <p className="text-xs mb-2" style={{ color: "var(--ink-sub)" }}>{syncStatus.last ? "Sincronizado " + syncStatus.last.toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" }) : "Sin sincronizar"}</p>
          )}
          <div className="flex items-center gap-3">
            <button onClick={onRefreshAll} className="text-xs flex items-center gap-1" style={{ color: "var(--ink-sub)" }}><RefreshCw size={12} /> Actualizar todo</button>
            <button onClick={onOpenSettings} className="text-xs" style={{ color: "var(--ink-sub)" }}>Configuración</button>
          </div>
        </div>
      </aside>
    </Fragment>
  );
}

/* ---------------------------------- app principal ---------------------------------- */

function App() {
  const [showSettings, setShowSettings] = useState(false);
  const [section, setSection] = useState("resumen");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [focusProjectId, setFocusProjectId] = useState(null);

  const proyectosSync = useDatasetSync("Proyectos", [], (arr) => arr, (state) => state);
  const calSync = useDatasetSync("Calendario", { items: [], risks: [] },
    (arr) => { const r = arr[0] || {}; return { items: r.items || [], risks: r.risks || [] }; },
    (state) => [{ id: "calendario", name: "Calendario de proyectos", client: "", type: "", items: state.items, risks: state.risks }]);
  const matSync = useDatasetSync("Documentacion", { projects: [], visits: [] },
    (arr) => { const r = arr[0] || {}; return { projects: r.projects || [], visits: r.visits || [] }; },
    (state) => [{ id: "documentacion", name: "Planos y materiales", client: "", type: "", projects: state.projects, visits: state.visits }]);
  const actSync = useDatasetSync("ActasOrdenes", { docs: [] },
    (arr) => { const r = arr[0] || {}; return { docs: r.docs || [] }; },
    (state) => [{ id: "actas-ordenes", name: "Actas y órdenes", client: "", type: "", docs: state.docs }]);
  const cajaSync = useDatasetSync("CajaChica", { funds: [], expenses: [] },
    (arr) => { const r = arr[0] || {}; return { funds: r.funds || [], expenses: r.expenses || [] }; },
    (state) => [{ id: "caja-chica", name: "Caja chica", client: "", type: "", funds: state.funds, expenses: state.expenses }]);

  const otSync = useDatasetSync("OrdenesTrabajo", [], (arr) => arr, (state) => state.map((o) => ({ ...o, type: "Orden de trabajo" })));

  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === "visible") {
        proyectosSync.reload(); calSync.reload(); matSync.reload(); actSync.reload(); cajaSync.reload(); otSync.reload();
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
    // eslint-disable-next-line
  }, []);

  const allLoaded = proyectosSync.loaded && calSync.loaded && matSync.loaded && actSync.loaded && cajaSync.loaded && otSync.loaded;
  const anyNeedsSetup = proyectosSync.needsSetup || calSync.needsSetup || matSync.needsSetup || actSync.needsSetup || cajaSync.needsSetup || otSync.needsSetup;

  if (!allLoaded) {
    return <div className="w-full h-full flex items-center justify-center" style={{ color: "var(--text-400)", fontFamily: "var(--font-body)" }}>Cargando…</div>;
  }

  if (anyNeedsSetup || showSettings) {
    return (
      <div className="app-shell" style={{ display: "block", overflow: "auto" }}>
        <style>{`.app-shell{ --ink-900:#12203A; --steel-200:#D7DEE5; --text-900:#16202E; --text-600:#52606D; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; font-family: var(--font-body); background:#F1F4F7; min-height:100vh; }
          .field{ width:100%; border:1px solid var(--steel-200); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text-900); background:#fff; }
          .field-label{ font-size:11px; color:var(--text-400,#8797A6); display:block; margin-bottom:4px; }
          .btn-primary{ background:var(--ink-900); color:#fff; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:500; }
          .btn-ghost{ border:1px solid var(--steel-200); color:var(--text-600); border-radius:6px; padding:9px 16px; font-size:13px; background:#fff; }`}</style>
        <SetupScreen
          initial={getSyncConfig()}
          onCancel={showSettings ? () => setShowSettings(false) : null}
          onSave={() => { setShowSettings(false); proyectosSync.reload(); calSync.reload(); matSync.reload(); actSync.reload(); cajaSync.reload(); otSync.reload(); }}
        />
      </div>
    );
  }

  const createProyecto = (form) => {
    const phases = CP_buildPhases(form.startDate, Number(form.weeks) || 1, Number(form.budget) || 0);
    const np = { id: uid(), name: form.name, client: form.client, type: form.type, manager: form.manager || "", notes: "", startDate: form.startDate, ctrlStart: form.ctrlStart || form.startDate, ctrlEnd: form.ctrlEnd || "", phases, risks: [], milestones: [] };
    proyectosSync.setState((prev) => [np, ...prev]);
    return np.id;
  };
  const updateProyecto = (id, patch) => proyectosSync.setState((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const deleteProyecto = (id) => proyectosSync.setState((prev) => prev.filter((p) => p.id !== id));

  const createMatProject = (form) => {
    const np = {
      id: uid(), name: form.name, client: form.client, manager: form.manager || "", notes: "",
      startDate: form.startDate || "", endDate: form.endDate || "",
      planosDueDate: form.planosDueDate || "", materialesDueDate: form.materialesDueDate || "",
      planos: [], materials: [],
    };
    matSync.setState((prev) => ({ ...prev, projects: [np, ...prev.projects] }));
    return np.id;
  };
  const updateMatProject = (id, patch) => matSync.setState((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const deleteMatProject = (id) => matSync.setState((prev) => ({ ...prev, projects: prev.projects.filter((p) => p.id !== id) }));
  const setMatVisits = (updater) => matSync.setState((prev) => ({ ...prev, visits: typeof updater === "function" ? updater(prev.visits) : updater }));

  const setCalItems = (updater) => calSync.setState((prev) => ({ ...prev, items: typeof updater === "function" ? updater(prev.items) : updater }));
  const setCalRisks = (updater) => calSync.setState((prev) => ({ ...prev, risks: typeof updater === "function" ? updater(prev.risks) : updater }));

  const setActDocs = (updater) => actSync.setState((prev) => ({ ...prev, docs: typeof updater === "function" ? updater(prev.docs) : updater }));

  const setCajaFunds = (updater) => cajaSync.setState((prev) => ({ ...prev, funds: typeof updater === "function" ? updater(prev.funds) : updater }));
  const setCajaExpenses = (updater) => cajaSync.setState((prev) => ({ ...prev, expenses: typeof updater === "function" ? updater(prev.expenses) : updater }));

  const setOtOrders = (updater) => otSync.setState((prev) => (typeof updater === "function" ? updater(prev) : updater));

  const syncStatus = {
    error: proyectosSync.syncError || calSync.syncError || matSync.syncError || actSync.syncError || cajaSync.syncError || otSync.syncError,
    last: [proyectosSync.lastSynced, calSync.lastSynced, matSync.lastSynced, actSync.lastSynced, cajaSync.lastSynced, otSync.lastSynced].filter(Boolean).sort((a, b) => b - a)[0] || null,
  };
  const refreshAll = () => { proyectosSync.reload(); calSync.reload(); matSync.reload(); actSync.reload(); cajaSync.reload(); otSync.reload(); };

  return (
    <div className="app-shell">
      <style>{`        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        .app-shell{ --ink-900:#12203A; --ink-800:#1B2E4F; --ink-sub: rgba(255,255,255,0.55);
          --steel-300:#C7D2DC; --steel-200:#D7DEE5; --steel-100:#E8ECF1;
          --paper:#F1F4F7; --surface:#FFFFFF; --amber-soft:#FBE8CB; --green-soft:#DCEEE5;
          --text-900:#16202E; --text-600:#52606D; --text-400:#8797A6;
          --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
          font-family: var(--font-body); display:flex; height:100vh; width:100%; background:var(--paper); overflow:hidden; }
        .app-shell input, .app-shell select, .app-shell button, .app-shell table { font-family: var(--font-body); }
        .field{ width:100%; border:1px solid var(--steel-200); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text-900); background:#fff; }
        .field:focus{ outline:2px solid ${COLORS.amber}55; border-color:${COLORS.amber}; }
        .field-label{ font-size:11px; color:var(--text-400); display:block; margin-bottom:4px; }
        .btn-primary{ background:var(--ink-900); color:#fff; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:500; }
        .btn-primary:hover{ background:var(--ink-800); }
        .btn-ghost{ border:1px solid var(--steel-200); color:var(--text-600); border-radius:6px; padding:9px 16px; font-size:13px; background:#fff; }
        .btn-ghost:hover{ background:var(--paper); }
        .btn-new{ display:flex; align-items:center; justify-content:center; gap:6px; background:${COLORS.amber}; color:var(--ink-900); font-weight:600; font-size:13px; border-radius:6px; padding:9px 0; }
        .btn-new:hover{ background:${COLORS.amberDark}; color:#fff; }
        .side-card{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; border:1px solid transparent; cursor:pointer; }
        .side-card:hover{ background:var(--ink-800); }
        .panel{ background:var(--surface); border:1px solid var(--steel-200); border-radius:8px; padding:18px; }
        .kpi-card{ background:var(--surface); border:1px solid var(--steel-200); border-left-width:3px; border-radius:6px; padding:14px 16px; }
        .kpi-number{ font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--text-900); font-variant-numeric: tabular-nums; }
        .kpi-label{ font-size:12px; color:var(--text-400); margin-top:1px; }
        .tab-btn{ font-size:12.5px; font-weight:500; padding:6px 14px; border-radius:5px; }
        .phase-node{ width:34px; height:34px; border-radius:999px; border-width:1px; border-style:solid; display:flex; align-items:center; justify-content:center; background:#fff; z-index:1; }
        .risk-pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:500; text-transform:capitalize; }
        .matrix-cell{ height:34px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
        @media print{
          body * { visibility: hidden; }
          #doc-preview, #doc-preview * { visibility: visible; }
          #informe-gerencial, #informe-gerencial * { visibility: visible; }
          #doc-preview {
            position: absolute !important; left: 0 !important; top: 0 !important;
            width: 100% !important; margin: 0 !important;
            border: none !important; border-radius: 0 !important;
          }
          #informe-gerencial { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; max-width:none !important; }
          .no-print { display: none !important; }
          .app-shell{ height:auto; overflow:visible; display:block; background:#fff; }
        }`}</style>

      <MasterSidebar section={section} setSection={setSection} open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} syncStatus={syncStatus} onRefreshAll={refreshAll} onOpenSettings={() => setShowSettings(true)} />

      <div className="flex-1 flex flex-col min-w-0">
        <div className="sm:hidden flex items-center gap-3 px-4 py-3 no-print" style={{ background: "var(--ink-900)", paddingTop: "calc(0.75rem + env(safe-area-inset-top))" }}>
          <button onClick={() => setMobileNavOpen(true)} aria-label="Abrir menú" style={{ color: "#fff" }}><Menu size={20} /></button>
          <div style={{ background: "#fff", borderRadius: 7, padding: 3, display: "flex", flexShrink: 0 }}>
            <img src={getLogo()} alt="Logo" style={{ height: 20, width: 20, objectFit: "contain" }} />
          </div>
          <span className="text-sm font-medium truncate" style={{ color: "#fff", fontFamily: "var(--font-display)" }}>Panel gerencial</span>
        </div>
        <main className="flex-1 overflow-y-auto">
          <div className="p-4 sm:p-8">
            {section === "resumen" ? (
              <ResumenModule proyectos={proyectosSync.state} calItems={calSync.state.items} matProjects={matSync.state.projects} actDocs={actSync.state.docs} cajaFunds={cajaSync.state.funds} cajaExpenses={cajaSync.state.expenses} otOrders={otSync.state} goTo={(key, id) => { if (id) setFocusProjectId(id); setSection(key); }} />
            ) : section === "proyectos" ? (
              <CP_Module focusId={focusProjectId} projects={proyectosSync.state} updateProject={updateProyecto} createProject={createProyecto} deleteProject={deleteProyecto} />
            ) : section === "calendario" ? (
              <CAL_Module items={calSync.state.items} setItems={setCalItems} risks={calSync.state.risks} setRisks={setCalRisks} cpProjects={proyectosSync.state} />
            ) : section === "materiales" ? (
              <MAT_Module projects={matSync.state.projects} updateProject={updateMatProject} createProject={createMatProject} deleteProject={deleteMatProject} visits={matSync.state.visits} setVisits={setMatVisits} cpProjects={proyectosSync.state} />
            ) : section === "actas" ? (
              <ACT_Module docs={actSync.state.docs} setDocs={setActDocs} cpProjects={proyectosSync.state} />
            ) : section === "ordenes" ? (
              <OT_Module orders={otSync.state} setOrders={setOtOrders} cpProjects={proyectosSync.state} />
            ) : (
              <CAJA_Module funds={cajaSync.state.funds} setFunds={setCajaFunds} expenses={cajaSync.state.expenses} setExpenses={setCajaExpenses} cpProjects={proyectosSync.state} />
            )}
          </div>
        </main>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
