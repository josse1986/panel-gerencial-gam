function ACT_Module({ docs, setDocs, cpProjects }) {
  const [tab, setTab] = useState("documentos");
  const [selectedId, setSelectedId] = useState(null);

  const selectedDoc = docs.find((d) => d.id === selectedId) || null;

  const createDoc = (docType) => {
    const nd = {
      id: uid(), docType, number: ACT_nextNumber(docs, docType),
      client: "", clientContact: "", workType: "", responsible: "",
      date: todayISO(), startDate: "", endDate: "",
      description: "", items: [], observations: "", internalNotes: "",
      status: "borrador",
    };
    setDocs((prev) => [nd, ...prev]);
    setSelectedId(nd.id);
  };
  const updateDoc = useCallback((patch) => {
    setDocs((prev) => prev.map((d) => (d.id === selectedId ? { ...d, ...patch } : d)));
  }, [selectedId, setDocs]);
  const deleteDoc = (id) => {
    setDocs((prev) => prev.filter((d) => d.id !== id));
    if (selectedId === id) setSelectedId(null);
  };

  return (
    <div className="space-y-6">
      <SubTabs tabs={[["documentos", "Documentos"], ["reportes", "Reportería"]]} active={tab} onChange={(t) => { setTab(t); setSelectedId(null); }} />
      {tab === "reportes" ? (
        <ACT_ReportingTab docs={docs} />
      ) : selectedDoc ? (
        <ACT_DocumentDetail doc={selectedDoc} onUpdate={updateDoc} onDelete={() => deleteDoc(selectedDoc.id)} onBack={() => setSelectedId(null)} cpProjects={cpProjects} />
      ) : (
        <ACT_DocumentsList docs={docs} onSelect={setSelectedId} onCreate={createDoc} onDelete={deleteDoc} />
      )}
    </div>
  );
}

/* ===== MODULO: CAJA CHICA ===== */
const CAJA_CATEGORIES = ["Alimentación", "Materiales", "Transporte", "Oficina", "Varios"];
const CAJA_CATEGORY_COLORS = {
  "Alimentación": "#E8A33D",
  "Materiales": "#3B6E91",
  "Transporte": "#2F7D5B",
  "Oficina": "#8B5FBF",
  "Varios": "#5A6C80",
};

function CAJA_computeBalance(funds, expenses) {
  const totalFunds = funds.reduce((a, f) => a + (Number(f.amount) || 0), 0);
  const totalExpenses = expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0);
  return { totalFunds, totalExpenses, balance: totalFunds - totalExpenses };
}

function CAJA_categoryBreakdown(expenses) {
  const total = expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0);
  return CAJA_CATEGORIES.map((cat) => {
    const sum = expenses.filter((e) => e.category === cat).reduce((a, e) => a + (Number(e.amount) || 0), 0);
    return { category: cat, total: sum, pct: total ? Math.round((sum / total) * 100) : 0 };
  }).filter((c) => c.total > 0);
}

function CAJA_projectBreakdown(expenses) {
  const map = {};
  expenses.forEach((e) => {
    const key = e.project || "Sin proyecto asignado";
    map[key] = (map[key] || 0) + (Number(e.amount) || 0);
  });
  return Object.entries(map).map(([project, total]) => ({ project, total })).sort((a, b) => b.total - a.total);
}

function CAJA_monthlyExpenses(expenses) {
  const map = {};
  expenses.forEach((e) => {
    if (!e.date) return;
    const key = e.date.slice(0, 7);
    map[key] = (map[key] || 0) + (Number(e.amount) || 0);
  });
  return Object.keys(map).sort().map((key) => {
    const d = new Date(key + "-01T00:00:00");
    return { key, label: d.toLocaleDateString("es-EC", { month: "short", year: "2-digit" }), total: map[key] };
  });
}

function CAJA_cajaRecommendations(funds, expenses, balance) {
  const out = [];
  if (balance.totalFunds > 0 && balance.balance < balance.totalFunds * 0.2) {
    out.push(`El saldo disponible (${money(balance.balance)}) está por debajo del 20% del total entregado histórico. Conviene solicitar una reposición del fondo pronto.`);
  }
  const thisMonth = todayISO().slice(0, 7);
  const monthly = CAJA_monthlyExpenses(expenses);
  const currentMonth = monthly.find((m) => m.key === thisMonth);
  if (currentMonth) {
    const cats = CAJA_categoryBreakdown(expenses.filter((e) => (e.date || "").slice(0, 7) === thisMonth));
    const top = cats.sort((a, b) => b.total - a.total)[0];
    if (top) out.push(`Este mes, la categoría "${top.category}" concentra el mayor gasto (${money(top.total)}, ${top.pct}% del total del mes).`);
  }
  const noReceipt = expenses.filter((e) => !e.receipt);
  if (noReceipt.length > 0) {
    out.push(`${noReceipt.length} gasto(s) no tienen comprobante registrado. Solicitar los respaldos pendientes ayuda a mantener la caja auditable.`);
  }
  const projects = CAJA_projectBreakdown(expenses);
  const topProject = projects[0];
  if (topProject && projects.length > 1) {
    out.push(`El proyecto "${topProject.project}" concentra el mayor gasto de caja chica (${money(topProject.total)}).`);
  }
  if (out.length === 0) out.push("La caja chica se encuentra en un estado saludable, sin observaciones por el momento.");
  return out;
}

function CAJA_CategoryDonut({ breakdown }) {
  const size = 160, stroke = 22, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const total = breakdown.reduce((a, b) => a + b.total, 0);
  let offset = 0;
  return (
    <div className="flex items-center gap-6 flex-wrap">
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--steel-100)" strokeWidth={stroke} />
        {breakdown.map((b, i) => {
          const frac = total ? b.total / total : 0;
          const dash = frac * c;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={CAJA_CATEGORY_COLORS[b.category] || COLORS.steel} strokeWidth={stroke}
              strokeDasharray={dash + " " + (c - dash)} strokeDashoffset={-offset} transform={"rotate(-90 " + size / 2 + " " + size / 2 + ")"}>
              <title>{b.category + ": " + money(b.total) + " (" + b.pct + "%)"}</title>
            </circle>
          );
          offset += dash;
          return el;
        })}
        <text x={size / 2} y={size / 2 - 4} textAnchor="middle" fontSize="18" fontWeight="700" fill="var(--text-900)" fontFamily="var(--font-display)">{money(total).replace(/\.00$/, "")}</text>
        <text x={size / 2} y={size / 2 + 14} textAnchor="middle" fontSize="10" fill="var(--text-400)">gastado</text>
      </svg>
      <div className="space-y-1.5">
        {breakdown.map((b, i) => (
          <div key={i} className="flex items-center gap-2 text-xs">
            <span style={{ width: 9, height: 9, borderRadius: 999, background: CAJA_CATEGORY_COLORS[b.category] || COLORS.steel, flexShrink: 0 }} />
            <span style={{ color: "var(--text-900)" }}>{b.category}</span>
            <span style={{ color: "var(--text-400)" }}>{money(b.total)} · {b.pct}%</span>
          </div>
        ))}
        {breakdown.length === 0 && <p className="text-xs" style={{ color: "var(--text-400)" }}>Sin gastos registrados todavía.</p>}
      </div>
    </div>
  );
}

function CAJA_MonthlyBarChart({ data }) {
  if (!data.length) return <p className="text-sm" style={{ color: "var(--text-400)" }}>Aún no hay suficientes datos para esta vista.</p>;
  const barW = 30, gap = 14, padL = 44, padT = 14, padB = 28, padR = 10;
  const chartH = 200;
  const max = Math.max(1, Math.max.apply(null, data.map((d) => d.total)));
  const chartW = data.length * (barW + gap) + padL + padR;
  const usableH = chartH - padT - padB;
  const yAt = (v) => padT + usableH - (v / max) * usableH;
  const ticks = [0, Math.round(max / 2), max];
  return (
    <div style={{ overflowX: "auto" }}>
      <svg width={chartW} height={chartH} viewBox={"0 0 " + chartW + " " + chartH}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={chartW - padR} y1={yAt(t)} y2={yAt(t)} stroke="var(--steel-100)" />
            <text x={padL - 6} y={yAt(t) + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{"$" + Math.round(t / 1000 >= 1 ? t / 1000 : t) + (t / 1000 >= 1 ? "k" : "")}</text>
          </g>
        ))}
        {data.map((d, i) => {
          const x = padL + i * (barW + gap);
          const h = (d.total / max) * usableH;
          const y = padT + usableH - h;
          return (
            <g key={d.key}>
              <rect x={x} y={y} width={barW} height={Math.max(0, h)} fill={COLORS.amber} rx="3"><title>{d.label + ": " + money(d.total)}</title></rect>
              <text x={x + barW / 2} y={chartH - padB + 12} textAnchor="middle" fontSize="9" fill="var(--text-400)">{d.label}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function CAJA_exportCajaExcel(funds, expenses, balance) {
  const wb = XLSX.utils.book_new();

  const resumen = [{

    "Saldo disponible": money(balance.balance), "Fecha del reporte": fdate(todayISO()),
  }];

  ws0["!cols"] = [{ wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, ws0, "Resumen");

  const fundsRows = funds.map((f) => ({ "Fecha": fdate(f.date), "Concepto": f.concept || "", "Responsable": f.custodian || "", "Método": f.method, "Monto": f.amount }));
  const ws1 = XLSX.utils.json_to_sheet(fundsRows.length ? fundsRows : [{ "Fecha": "Sin registros" }]);
  ws1["!cols"] = [{ wch: 14 }, { wch: 30 }, { wch: 20 }, { wch: 14 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws1, "Fondos");

  const expRows = expenses.map((e) => ({
    "Fecha": fdate(e.date), "Categoría": e.category, "Proyecto": e.project || "", "Descripción": e.description,
    "Responsable": e.responsible || "", "Método": e.method, "Comprobante": e.receipt ? "Sí" : "No", "Monto": e.amount, "Notas": e.notes || "",
  }));
  const ws2 = XLSX.utils.json_to_sheet(expRows.length ? expRows : [{ "Fecha": "Sin registros" }]);
  ws2["!cols"] = [{ wch: 14 }, { wch: 16 }, { wch: 22 }, { wch: 34 }, { wch: 18 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Gastos");

  const catRows = CAJA_categoryBreakdown(expenses).map((c) => ({ "Categoría": c.category, "Total": c.total, "% del gasto": c.pct + "%" }));
  const ws3 = XLSX.utils.json_to_sheet(catRows.length ? catRows : [{ "Categoría": "Sin datos" }]);
  ws3["!cols"] = [{ wch: 18 }, { wch: 14 }, { wch: 12 }];

/* ===== MODULO: ORDENES DE TRABAJO ===== */

const OT_ESTADOS = [
  { key: "borrador", label: "Borrador", color: "#8797A6" },
  { key: "emitida", label: "Emitida", color: COLORS.steel },
  { key: "en_ejecucion", label: "En ejecución", color: COLORS.amber },
  { key: "entregada", label: "Entregada", color: COLORS.green },
  { key: "cerrada", label: "Cerrada", color: COLORS.ink },
  { key: "anulada", label: "Anulada", color: COLORS.red },
];
const OT_TERMINAL = ["entregada", "cerrada", "anulada"];
const OT_estadoMeta = (k) => OT_ESTADOS.find((e) => e.key === k) || OT_ESTADOS[0];
const num = (v) => { const n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

function OT_workdays(a, b) {
  if (!a || !b) return null;
  let d = new Date(a + "T00:00:00"); const end = new Date(b + "T00:00:00");
  if (end < d) return 0;
  let n = 0;
  while (d <= end) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; d = new Date(d.getTime() + 86400000); }
  return n;
}

function OT_calc(o) {
  const refLab = o.laborIsReference !== false;
  const budget = r2(num(o.budgetMaterials) + num(o.budgetTransport) + (refLab ? 0 : num(o.budgetLabor)));
  const actual = r2(num(o.actualMaterials) + num(o.actualTransport) + (refLab ? 0 : num(o.actualLabor)));
  const variance = r2(actual - budget);
  const execPct = budget > 0 ? Math.round((actual / budget) * 100) : 0;
  const status = o.status || "borrador";
  const terminal = OT_TERMINAL.includes(status);
  const today = todayISO();
  const late = !terminal && !!o.plannedEnd && o.plannedEnd < today;
  const over = budget > 0 && actual > budget + 0.004;
  const endReal = o.realEnd || "";
  const workdays = OT_workdays(o.realStart || o.plannedStart, endReal || (terminal ? "" : today));
  let onTime = null;
  if ((status === "entregada" || status === "cerrada") && endReal) {
    if (o.plannedEnd) onTime = endReal <= o.plannedEnd;
    else if (num(o.authorizedDays) > 0 && o.realStart) onTime = OT_workdays(o.realStart, endReal) <= num(o.authorizedDays);
  }
  const level = over || (late && daysBetween(o.plannedEnd, today) > 7) ? "rojo" : late || (budget > 0 && actual > budget * 0.9) ? "amarillo" : "verde";
  return { budget, actual, variance, execPct, status, terminal, late, over, onTime, level, workdays, labor: num(o.budgetLabor) };
}

function OT_buildRows(orders) {
  return orders.map((o) => {
    const c = OT_calc(o);
    return { ...c, id: o.id, number: num(o.number), name: o.name || "Sin nombre", client: o.client || "Sin cliente", coordinator: o.coordinator || "Sin responsable", place: o.place || "",
      issue: o.issueDate || "", start: o.plannedStart || "", end: o.plannedEnd || "", realEnd: o.realEnd || "", progress: num(o.progress), raw: o };
  });
}

function OT_blank(orders) {
  const max = orders.reduce((m, o) => Math.max(m, num(o.number)), 0);
  return {
    id: uid(), number: max + 1, issueDate: todayISO(), name: "", client: "", type: "Orden de trabajo", projectId: "", place: "", coordinator: "", description: "",
    budgetMaterials: "", budgetTransport: "", budgetLabor: "", laborIsReference: true,
    actualMaterials: "", actualTransport: "", actualLabor: "",
    plannedStart: "", plannedEnd: "", authorizedDays: "", realStart: "", realEnd: "", staff: "", notes: "",
    authorizedBy: "", receivedBy: "", receivedDate: "", status: "emitida", progress: 0,
  };
}

/* ---- gráficos reutilizables ---- */
function OT_GroupedBars({ data, colors, names, fmt, selected, onPick, height }) {
  const W = 720, H = height || 220, L = 44, R = 10, T = 14, B = 28;
  const max = Math.max(1, ...data.map((d) => Math.max(d.a, d.b)));
  const cw = (W - L - R) / data.length;
  const bw = Math.min(16, cw / 3);
  const yOf = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = [0, 0.5, 1].map((f) => max * f);
  const f = fmt || ((v) => String(Math.round(v)));
  return (
    <div>
      <div className="flex items-center gap-4 flex-wrap text-xs mb-2" style={{ color: "var(--text-600)" }}>
        {names.map((n, i) => <span key={i} className="flex items-center gap-1"><span style={{ width: 10, height: 10, background: colors[i], borderRadius: 2 }} />{n}</span>)}
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {ticks.map((t, i) => (<g key={i}><line x1={L} x2={W - R} y1={yOf(t)} y2={yOf(t)} stroke="var(--steel-100)" /><text x={L - 5} y={yOf(t) + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{f(t)}</text></g>))}
        {data.map((d, i) => {
          const cx = L + cw * i + cw / 2; const sel = selected === d.m;
          return (
            <g key={i} style={{ cursor: onPick ? "pointer" : "default" }} onClick={() => onPick && onPick(sel ? "todos" : d.m)}>
              <rect x={L + cw * i} y={T} width={cw} height={H - T - B} fill={sel ? "var(--amber-soft)" : "transparent"} opacity={sel ? 0.7 : 1} />
              <rect x={cx - bw - 1} y={yOf(d.a)} width={bw} height={Math.max(0, H - B - yOf(d.a))} fill={colors[0]} rx="2" />
              <rect x={cx + 1} y={yOf(d.b)} width={bw} height={Math.max(0, H - B - yOf(d.b))} fill={colors[1]} rx="2" />
              <text x={cx} y={H - 10} textAnchor="middle" fontSize="11" fill={sel ? COLORS.ink : "var(--text-600)"} fontWeight={sel ? 700 : 400}>{d.label}</text>
              <title>{d.label + ": " + names[0] + " " + f(d.a) + " · " + names[1] + " " + f(d.b)}</title>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function OT_HBars({ items, fmt, color, active, onPick, max }) {
  const mx = Math.max(1, ...items.map((i) => i.value));
  if (!items.length) return <p className="text-sm" style={{ color: "var(--text-400)" }}>Sin datos con estos filtros.</p>;
  return (
    <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
      {items.slice(0, max || 8).map((it) => (
        <div key={it.label} style={{ cursor: onPick ? "pointer" : "default" }} onClick={() => onPick && onPick(active === it.label ? "todos" : it.label)}>
          <div className="flex items-center justify-between text-xs mb-0.5 gap-2">
            <span className="truncate" style={{ color: "var(--text-900)", fontWeight: active === it.label ? 700 : 500 }}>{it.label}</span>
            <span style={{ color: "var(--text-400)" }}>{fmt ? fmt(it.value) : it.value}{it.sub ? " · " + it.sub : ""}</span>

    </div>
  );
}

  <h2>3. Plazo y programación</h2><table>${row("Fecha prevista de inicio", esc(o.plannedStart))}${row("Fecha prevista de entrega", esc(o.plannedEnd))}${row("Duración autorizada", esc(o.authorizedDays) + (o.authorizedDays ? " días laborables" : ""))}${row("Personal asignado", esc(o.staff))}${row("Observaciones / hitos", esc(o.notes))}</table>
  <h2>4. Control y autorización</h2><p style="margin:6px 0">Cualquier gasto adicional o cambio de plazo debe ser aprobado antes de ejecutarse.</p><table>${row("Elaborado / autorizado por", esc(o.authorizedBy))}${row("Recibido por coordinador", esc(o.receivedBy))}${row("Fecha de recepción", esc(o.receivedDate))}</table>
  <p class="foot">Documento interno de control operativo y presupuestario.</p></body></html>`;
  const w = window.open("", "_blank");
  if (!w) { alert("El navegador bloqueó la ventana. Permite ventanas emergentes para imprimir."); return; }
  w.document.write(html); w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
}

/* ---- exportación a Excel ---- */
function OT_exportExcel(rows) {
  const wb = XLSX.utils.book_new();
  const ordenes = rows.map((r) => ({
    "N.º": r.number, Proyecto: r.name, Cliente: r.client, Lugar: r.place, Responsable: r.coordinator, Estado: OT_estadoMeta(r.status).label,
    "Fecha emisión": r.issue, "Inicio previsto": r.start, "Entrega prevista": r.end, "Entrega real": r.realEnd, "Avance %": r.progress,
    "Materiales USD": num(r.raw.budgetMaterials), "Transporte USD": num(r.raw.budgetTransport), "Mano de obra USD (ref.)": num(r.raw.budgetLabor),
    "Total presupuestado USD": r.budget, "Ejecutado USD": r.actual, "Variación USD": r.variance, "Ejecución %": r.execPct,
    "Atrasada": r.late ? "Sí" : "No", "Entregada a tiempo": r.onTime === null ? "" : r.onTime ? "Sí" : "No",
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ordenes), "Órdenes");
  const group = (keyFn) => { const m = {}; rows.forEach((r) => { const k = keyFn(r) || "—"; m[k] = m[k] || { n: 0, b: 0, a: 0 }; m[k].n++; m[k].b += r.budget; m[k].a += r.actual; }); return Object.entries(m).map(([k, v]) => ({ Grupo: k, "N.º órdenes": v.n, "Presupuestado USD": r2(v.b), "Ejecutado USD": r2(v.a), "Variación USD": r2(v.a - v.b) })); };
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(group((r) => r.issue ? r.issue.slice(0, 7) : "")), "Por mes");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(group((r) => r.client)), "Por cliente");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(group((r) => r.coordinator)), "Por responsable");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(group((r) => OT_estadoMeta(r.status).label)), "Por estado");
  XLSX.writeFile(wb, "ordenes_de_trabajo_" + todayISO() + ".xlsx");
}

function OT_recommendations(rows) {
  const out = [];
  const act = rows.filter((r) => r.status !== "anulada");
  const late = act.filter((r) => r.late);
  if (late.length) out.push(`${late.length} orden(es) atrasadas respecto a la fecha prevista de entrega: ${late.slice(0, 4).map((r) => "N.º " + r.number).join(", ")}. Confirmar nuevo plazo con el coordinador antes de continuar.`);
  const over = act.filter((r) => r.over);
  if (over.length) out.push(`${over.length} orden(es) superan su presupuesto autorizado (sobrecosto total ${money(over.reduce((a, r) => a + r.variance, 0))}). Todo gasto adicional debe aprobarse antes de ejecutarse.`);
  const near = act.filter((r) => !r.over && !r.terminal && r.budget > 0 && r.execPct >= 90);
  if (near.length) out.push(`${near.length} orden(es) ya consumieron 90% o más de su presupuesto sin estar entregadas.`);
  const noDates = act.filter((r) => !r.terminal && (!r.start || !r.end));
  if (noDates.length) out.push(`${noDates.length} orden(es) sin fechas previstas de inicio o entrega: no se pueden controlar los plazos.`);
  const noRec = act.filter((r) => r.status !== "borrador" && !r.raw.receivedDate);
  if (noRec.length) out.push(`${noRec.length} orden(es) sin fecha de recepción por el coordinador.`);
  const done = act.filter((r) => r.onTime !== null);
  if (done.length) { const ok = done.filter((r) => r.onTime).length; out.push(`Cumplimiento de plazo en órdenes entregadas: ${Math.round((ok / done.length) * 100)}% (${ok} de ${done.length}).`); }
  if (!out.length) out.push("Las órdenes de trabajo están en control: sin atrasos ni sobrecostos.");
  return out;
}

/* ---- módulo ---- */
function OT_Module({ orders, setOrders, cpProjects }) {
  const now = new Date();
  const [tab, setTab] = useState("resumen");
  const [editing, setEditing] = useState(null); // objeto en edición
  const [isNew, setIsNew] = useState(false);
  const [fYear, setFYear] = useState("todos");
  const [fMonth, setFMonth] = useState("todos");
  const [fEstado, setFEstado] = useState("todos");
  const [fClient, setFClient] = useState("todos");
  const [fCoord, setFCoord] = useState("todos");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ key: "number", dir: "desc" });
  const [confirmId, setConfirmId] = useState(null);

  const rows = useMemo(() => OT_buildRows(orders), [orders]);
  const years = useMemo(() => [...new Set([String(now.getFullYear()), ...rows.map((r) => r.issue.slice(0, 4)).filter(Boolean)])].sort().reverse(), [rows]);
  const clients = useMemo(() => [...new Set(rows.map((r) => r.client))].sort(), [rows]);
  const coords = useMemo(() => [...new Set(rows.map((r) => r.coordinator))].sort(), [rows]);

  const filtered = rows.filter((r) =>
    (fYear === "todos" || r.issue.slice(0, 4) === fYear) &&
    (fMonth === "todos" || Number(r.issue.slice(5, 7)) === Number(fMonth)) &&
    (fEstado === "todos" || r.status === fEstado || (fEstado === "atrasada" && r.late)) &&
    (fClient === "todos" || r.client === fClient) && (fCoord === "todos" || r.coordinator === fCoord) &&
    (!q.trim() || (r.name + " " + r.client + " " + r.place + " " + r.number).toLowerCase().includes(q.trim().toLowerCase())));
  const valid = filtered.filter((r) => r.status !== "anulada");
  const hayFiltros = fYear !== "todos" || fMonth !== "todos" || fEstado !== "todos" || fClient !== "todos" || fCoord !== "todos" || q;
  const reset = () => { setFYear("todos"); setFMonth("todos"); setFEstado("todos"); setFClient("todos"); setFCoord("todos"); setQ(""); };

  const totB = r2(valid.reduce((a, r) => a + r.budget, 0));
  const totA = r2(valid.reduce((a, r) => a + r.actual, 0));
  const enEjec = valid.filter((r) => !r.terminal).length;
  const atrasadas = valid.filter((r) => r.late).length;
  const sobre = valid.filter((r) => r.over).length;
  const entreg = valid.filter((r) => r.onTime !== null);
  const aTiempo = entreg.length ? Math.round((entreg.filter((r) => r.onTime).length / entreg.length) * 100) : null;
  const ticket = valid.length ? r2(totB / valid.length) : 0;

  const chartYear = fYear === "todos" ? now.getFullYear() : Number(fYear);
  const monthData = RES_MESES.map((label, i) => {
    const m = i + 1;
    const inM = rows.filter((r) => r.status !== "anulada" && r.issue && Number(r.issue.slice(0, 4)) === chartYear && Number(r.issue.slice(5, 7)) === m &&
      (fEstado === "todos" || r.status === fEstado) && (fClient === "todos" || r.client === fClient) && (fCoord === "todos" || r.coordinator === fCoord));
    return { label, m, n: inM.length, a: r2(inM.reduce((s, r) => s + r.budget, 0)), b: r2(inM.reduce((s, r) => s + r.actual, 0)),
      emit: inM.length, entr: inM.filter((r) => r.terminal).length };
  });
  const estadoGroups = OT_ESTADOS.map((e) => ({ ...e, count: filtered.filter((r) => r.status === e.key).length }));
  const group = (keyFn, valFn) => { const m = {}; valid.forEach((r) => { const k = keyFn(r); m[k] = (m[k] || 0) + valFn(r); }); return Object.entries(m).map(([label, value]) => ({ label, value: r2(value) })).sort((a, b) => b.value - a.value); };
  const byClient = group((r) => r.client, (r) => r.budget);
  const byCoord = group((r) => r.coordinator, (r) => r.budget);
  const comp = {
    mat: valid.reduce((a, r) => a + num(r.raw.budgetMaterials), 0),
    trans: valid.reduce((a, r) => a + num(r.raw.budgetTransport), 0),
    lab: valid.reduce((a, r) => a + (r.raw.laborIsReference !== false ? 0 : num(r.raw.budgetLabor)), 0),
  };
  const compTot = comp.mat + comp.trans + comp.lab;

  const sorted = [...filtered].sort((a, b) => {
    const av = a[sort.key], bv = b[sort.key];
    const c = typeof av === "number" && typeof bv === "number" ? av - bv : String(av || "").localeCompare(String(bv || ""), "es");
    return sort.dir === "asc" ? c : -c;
  });
  const sk = (key) => setSort((s) => s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" });
  const Th = ({ k, children, right }) => <th className="font-medium pb-2 pr-3 cursor-pointer select-none whitespace-nowrap" style={{ textAlign: right ? "right" : "left" }} onClick={() => sk(k)}>{children}{sort.key === k ? (sort.dir === "asc" ? " ▲" : " ▼") : ""}</th>;

  const startNew = () => { setEditing(OT_blank(orders)); setIsNew(true); setTab("ordenes"); };
  const startEdit = (id) => { const o = orders.find((x) => x.id === id); if (o) { setEditing({ ...OT_blank([]), ...o }); setIsNew(false); setTab("ordenes"); } };
  const save = (o) => { setOrders((prev) => prev.some((x) => x.id === o.id) ? prev.map((x) => x.id === o.id ? o : x) : [o, ...prev]); setEditing(null); };
  const remove = (id) => { setOrders((prev) => prev.filter((x) => x.id !== id)); setConfirmId(null); };

  const Header = (
    <div className="flex items-center justify-between gap-3 flex-wrap">
      <SubTabs tabs={[["resumen", "Resumen"], ["ordenes", "Órdenes"], ["reportes", "Reportería"]]} active={tab} onChange={(t) => { setTab(t); setEditing(null); }} />
      <button onClick={startNew} className="btn-primary text-xs py-2 px-3 flex items-center gap-1" style={{ display: "inline-flex" }}><Plus size={13} />Nueva orden de trabajo</button>
    </div>
  );

  if (editing) {
    return (
      <div className="space-y-6">
        {Header}
        <OT_Form key={editing.id} initial={editing} isNew={isNew} cpProjects={cpProjects} onSave={save} onCancel={() => setEditing(null)} />
      </div>
    );
  }

  const Filters = (
    <Panel>
      <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
        <div><label className="field-label">Año (emisión)</label><select className="field" value={fYear} onChange={(e) => setFYear(e.target.value)}><option value="todos">Todos</option>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></div>
        <div><label className="field-label">Mes</label><select className="field" value={fMonth} onChange={(e) => setFMonth(e.target.value)}><option value="todos">Todos</option>{RES_MESES_LARGO.map((m, i) => <option key={i} value={i + 1}>{m}</option>)}</select></div>
        <div><label className="field-label">Estado</label><select className="field" value={fEstado} onChange={(e) => setFEstado(e.target.value)}><option value="todos">Todos</option>{OT_ESTADOS.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}<option value="atrasada">Atrasadas</option></select></div>
        <div><label className="field-label">Cliente</label><select className="field" value={fClient} onChange={(e) => setFClient(e.target.value)}><option value="todos">Todos</option>{clients.map((c) => <option key={c} value={c}>{c}</option>)}</select></div>
        <div><label className="field-label">Responsable</label><select className="field" value={fCoord} onChange={(e) => setFCoord(e.target.value)}><option value="todos">Todos</option>{coords.map((c) => <option key={c} value={c}>{c}</option>)}</select></div>
        <div><label className="field-label">Buscar</label><input className="field" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Proyecto, cliente, N.º…" /></div>
      </div>
      <div className="flex items-center justify-between gap-3 flex-wrap mt-3">
        <p className="text-xs" style={{ color: "var(--text-600)" }}>{filtered.length} orden(es) en el filtro{rows.length !== filtered.length ? " de " + rows.length : ""}</p>
        {hayFiltros && <button onClick={reset} className="btn-ghost py-1 px-3 text-xs">Restablecer filtros</button>}
      </div>
    </Panel>
  );

  if (tab === "resumen") {
    return (
      <div className="space-y-6">
        {Header}
        {Filters}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <KpiCard accent={COLORS.ink}><p className="kpi-number">{valid.length}</p><p className="kpi-label">Órdenes de trabajo (sin anuladas)</p></KpiCard>
          <KpiCard accent={COLORS.steel}><p className="kpi-number">{money(totB)}</p><p className="kpi-label">Presupuesto autorizado total</p></KpiCard>
          <KpiCard accent={totA > totB ? COLORS.red : COLORS.green}><p className="kpi-number">{money(totA)}</p><p className="kpi-label">Ejecutado · {totB ? Math.round((totA / totB) * 100) : 0}% · {totA > totB ? "sobrecosto " : "saldo "}{money(Math.abs(totB - totA))}</p></KpiCard>
          <KpiCard accent={COLORS.amber}><p className="kpi-number">{enEjec}</p><p className="kpi-label">Abiertas (no entregadas)</p></KpiCard>
          <KpiCard accent={atrasadas ? COLORS.red : COLORS.green}><p className="kpi-number">{atrasadas}</p><p className="kpi-label">Atrasadas</p></KpiCard>
          <KpiCard accent={sobre ? COLORS.red : COLORS.green}><p className="kpi-number">{sobre}</p><p className="kpi-label">Sobre presupuesto</p></KpiCard>
          <KpiCard accent={aTiempo !== null && aTiempo < 80 ? COLORS.amber : COLORS.green}><p className="kpi-number">{aTiempo === null ? "—" : aTiempo + "%"}</p><p className="kpi-label">Entregadas a tiempo</p></KpiCard>
          <KpiCard accent="var(--steel-300)"><p className="kpi-number">{money(ticket)}</p><p className="kpi-label">Valor promedio por orden</p></KpiCard>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <Panel><PanelHeader title={"Órdenes emitidas y cerradas por mes · " + chartYear} />
            <OT_GroupedBars data={monthData.map((d) => ({ ...d, a: d.emit, b: d.entr }))} colors={[COLORS.ink, COLORS.green]} names={["Emitidas", "Entregadas/cerradas"]} selected={fMonth === "todos" ? null : Number(fMonth)} onPick={(m) => { setFMonth(String(m)); if (fYear === "todos") setFYear(String(chartYear)); }} /></Panel>
          <Panel><PanelHeader title={"Presupuesto vs. ejecutado por mes (USD) · " + chartYear} />
            <OT_GroupedBars data={monthData} colors={[COLORS.steel, COLORS.amber]} names={["Presupuestado", "Ejecutado"]} fmt={(v) => "$" + Math.round(v)} selected={fMonth === "todos" ? null : Number(fMonth)} onPick={(m) => { setFMonth(String(m)); if (fYear === "todos") setFYear(String(chartYear)); }} /></Panel>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <Panel><PanelHeader title="Estado de las órdenes (clic para filtrar)" />
            <RES_ProjectStatusDonut groups={estadoGroups} total={filtered.length} active={fEstado} onPick={setFEstado} unit={["orden", "órdenes"]} /></Panel>
          <Panel><PanelHeader title="Composición del presupuesto" />
            {compTot > 0 ? (
              <div>
                <div style={{ display: "flex", height: 22, borderRadius: 6, overflow: "hidden" }}>
                  <div style={{ width: (comp.mat / compTot) * 100 + "%", background: COLORS.ink }} title="Materiales" />
                  <div style={{ width: (comp.trans / compTot) * 100 + "%", background: COLORS.amber }} title="Transporte" />
                  <div style={{ width: (comp.lab / compTot) * 100 + "%", background: COLORS.green }} title="Mano de obra" />
                </div>
                <div className="mt-3 space-y-1 text-xs" style={{ color: "var(--text-600)" }}>
                  <p><span style={{ color: COLORS.ink }}>■</span> Materiales: {money(comp.mat)} · {Math.round((comp.mat / compTot) * 100)}%</p>
                  <p><span style={{ color: COLORS.amber }}>■</span> Movilización / transporte: {money(comp.trans)} · {Math.round((comp.trans / compTot) * 100)}%</p>
                  <p><span style={{ color: COLORS.green }}>■</span> Mano de obra (solo las que suman al total): {money(comp.lab)} · {Math.round((comp.lab / compTot) * 100)}%</p>
                </div>
              </div>
            ) : <p className="text-sm" style={{ color: "var(--text-400)" }}>Sin presupuesto registrado con estos filtros.</p>}</Panel>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <Panel><PanelHeader title="Presupuesto por cliente (clic para filtrar)" /><OT_HBars items={byClient} fmt={money} color={COLORS.amber} active={fClient} onPick={setFClient} /></Panel>
          <Panel><PanelHeader title="Presupuesto por responsable (clic para filtrar)" /><OT_HBars items={byCoord} fmt={money} color={COLORS.ink} active={fCoord} onPick={setFCoord} /></Panel>
        </div>

        <Panel><PanelHeader title="Presupuesto vs. ejecutado por orden" />
          <OT_HBars items={[...valid].sort((a, b) => b.budget - a.budget).map((r) => ({ label: "N.º " + r.number + " · " + r.name, value: r.budget, sub: "ejec. " + money(r.actual) + " (" + r.execPct + "%)", color: r.over ? COLORS.red : r.execPct >= 90 ? COLORS.amber : COLORS.green }))} fmt={money} max={12} onPick={null} /></Panel>

        <Panel><PanelHeader title="Recomendaciones" />
          <ul className="space-y-2 text-sm" style={{ color: "var(--text-900)" }}>{OT_recommendations(filtered).map((t, i) => <li key={i}>· {t}</li>)}</ul></Panel>
      </div>
    );
  }

  if (tab === "ordenes") {
    return (
      <div className="space-y-6">
        {Header}
        {Filters}
        <Panel>
          {sorted.length ? (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-xs" style={{ color: "var(--text-400)" }}>
                  <Th k="number">N.º</Th><Th k="name">Proyecto</Th><Th k="client">Cliente</Th><Th k="coordinator">Responsable</Th><Th k="status">Estado</Th><Th k="issue">Emisión</Th><Th k="end">Entrega prev.</Th>
                  <Th k="budget" right>Presupuesto</Th><Th k="actual" right>Ejecutado</Th><Th k="execPct" right>Ejec.</Th><th />
                </tr></thead>
                <tbody>
                  {sorted.map((r) => {
                    const em = OT_estadoMeta(r.status);
                    return (
                      <tr key={r.id} style={{ borderTop: "1px solid var(--steel-100)" }}>
                        <td className="py-2 pr-3 font-medium">{r.number}</td>
                        <td className="py-2 pr-3 font-medium cursor-pointer" style={{ color: "var(--text-900)" }} onClick={() => startEdit(r.id)}>{r.name}</td>
                        <td className="py-2 pr-3" style={{ color: "var(--text-600)" }}>{r.client}</td>
                        <td className="py-2 pr-3" style={{ color: "var(--text-600)" }}>{r.coordinator}</td>
                        <td className="py-2 pr-3 whitespace-nowrap"><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 999, background: em.color, marginRight: 6 }} />{em.label}{r.late ? <span style={{ color: COLORS.red, marginLeft: 6, fontSize: 11 }}>atrasada</span> : null}</td>
                        <td className="py-2 pr-3 whitespace-nowrap">{fdate(r.issue)}</td>
                        <td className="py-2 pr-3 whitespace-nowrap">{fdate(r.end)}</td>
                        <td className="py-2 pr-3 text-right whitespace-nowrap">{money(r.budget)}</td>
                        <td className="py-2 pr-3 text-right whitespace-nowrap" style={{ color: r.over ? COLORS.red : "var(--text-900)" }}>{money(r.actual)}</td>
                        <td className="py-2 pr-3 text-right" style={{ color: r.over ? COLORS.red : "var(--text-900)" }}>{r.execPct}%</td>
                        <td className="py-2 whitespace-nowrap text-right">
                          {confirmId === r.id ? (
                            <span><button className="text-xs mr-2" style={{ color: COLORS.red }} onClick={() => remove(r.id)}>Eliminar</button><button className="text-xs" style={{ color: "var(--text-400)" }} onClick={() => setConfirmId(null)}>Cancelar</button></span>
                          ) : (
                            <span className="flex items-center gap-3 justify-end">
                              <button aria-label="Editar" title="Editar" onClick={() => startEdit(r.id)} style={{ color: "var(--text-400)" }}><Pencil size={14} /></button>
                              <button aria-label="Imprimir" title="Imprimir / PDF" onClick={() => OT_printOrder(r.raw)} style={{ color: "var(--text-400)" }}><Printer size={14} /></button>
                              <button aria-label="Eliminar" title="Eliminar" onClick={() => setConfirmId(r.id)} style={{ color: "var(--text-400)" }}><Trash2 size={14} /></button>
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ) : <p className="text-sm" style={{ color: "var(--text-400)" }}>{rows.length ? "No hay órdenes con estos filtros." : "Aún no hay órdenes de trabajo. Crea la primera con «Nueva orden de trabajo»."}</p>}
        </Panel>
      </div>
    );
  }

  return (
    <div className="space-y-6">
      {Header}
      {Filters}
      <Panel>
        <PanelHeader title="Excel de respaldo" />

const RES_MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const RES_MESES_LARGO = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const RES_ESTADOS = [
  { key: "culminado", label: "Culminados", color: COLORS.green },
  { key: "en_curso", label: "En curso, sin alertas", color: COLORS.steel },
  { key: "atencion", label: "En atención", color: COLORS.amber },
  { key: "critico", label: "Críticos", color: COLORS.red },
];

function RES_buildRows(proyectos) {
  return proyectos.map((p) => {
    const rag = CP_computeRag(p);
    const d = CP_projectDates(p);
    const estado = CP_projectState(p);
    const dur = d.start && d.end ? Math.max(0, daysBetween(d.start, d.end)) : null;
    const abiertos = (p.risks || []).filter((r) => r.status === "abierto").length;
    return {
      id: p.id, name: p.name, client: p.client || "Sin cliente", estado,
      start: d.start, end: d.end, sinFechaControl: !d.hasCtrlStart, terminadoSinFecha: estado === "culminado" && !d.end,
      dur, avance: rag.avanceFisico, presupuesto: rag.planned, ejecutado: rag.actual, ejecPct: rag.avancePresupuestario, riesgos: abiertos,
    };
  });
}

function RES_inMonth(iso, year, month) {
  if (!iso) return false;
  const y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7));
  if (year !== "todos" && y !== Number(year)) return false;
  if (month !== "todos" && m !== Number(month)) return false;
  return true;
}
function RES_activeInMonth(r, year, month) {
  if (!r.start) return false;
  if (year === "todos") return true;
  const y = Number(year);
  const from = month === "todos" ? y + "-01-01" : y + "-" + String(month).padStart(2, "0") + "-01";
  const lastDay = month === "todos" ? 31 : new Date(y, Number(month), 0).getDate();
  const to = month === "todos" ? y + "-12-31" : y + "-" + String(month).padStart(2, "0") + "-" + String(lastDay).padStart(2, "0");
  return r.start <= to && (!r.end || r.end >= from);
}

function RES_MonthlyChart({ rows, year, month, onPickMonth }) {
  const y = year === "todos" ? new Date().getFullYear() : Number(year);
  const data = RES_MESES.map((label, i) => {
    const key = y + "-" + String(i + 1).padStart(2, "0");
    const lastDay = new Date(y, i + 1, 0).getDate();
    const endOfMonth = key + "-" + String(lastDay).padStart(2, "0");
    return {
      label, m: i + 1,
      ini: rows.filter((r) => r.start && r.start.slice(0, 7) === key).length,
      ter: rows.filter((r) => r.end && r.end.slice(0, 7) === key).length,
      act: rows.filter((r) => r.start && r.start <= endOfMonth && (!r.end || r.end > endOfMonth)).length,
    };
  });
  const W = 720, H = 230, L = 34, R = 12, T = 16, B = 30;
  const max = Math.max(1, ...data.map((d) => Math.max(d.ini, d.ter, d.act)));
  const top = Math.ceil(max / 2) * 2 || 2;
  const cw = (W - L - R) / 12;
  const yOf = (v) => T + (H - T - B) * (1 - v / top);
  const bw = Math.min(16, cw / 3);
  const line = data.map((d, i) => (L + cw * i + cw / 2) + "," + yOf(d.act)).join(" ");
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(top * f));
  return (
    <div>
      <div className="flex items-center gap-4 flex-wrap text-xs mb-2" style={{ color: "var(--text-600)" }}>
        <span className="flex items-center gap-1"><span style={{ width: 10, height: 10, background: COLORS.ink, borderRadius: 2 }} />Iniciados</span>
        <span className="flex items-center gap-1"><span style={{ width: 10, height: 10, background: COLORS.green, borderRadius: 2 }} />Terminados</span>
        <span className="flex items-center gap-1"><span style={{ width: 14, height: 0, borderTop: "2px solid " + COLORS.amber }} />Activos al cierre del mes</span>
        <span style={{ color: "var(--text-400)" }}>Año {y} · clic en un mes para filtrar</span>
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={L} x2={W - R} y1={yOf(t)} y2={yOf(t)} stroke="var(--steel-100)" />
            <text x={L - 6} y={yOf(t) + 3} textAnchor="end" fontSize="10" fill="var(--text-400)">{t}</text>
          </g>
        ))}
        {data.map((d, i) => {
          const cx = L + cw * i + cw / 2;
          const sel = month !== "todos" && Number(month) === d.m;
          return (
            <g key={i} style={{ cursor: "pointer" }} onClick={() => onPickMonth(sel ? "todos" : d.m, y)}>
              <rect x={L + cw * i} y={T} width={cw} height={H - T - B} fill={sel ? "var(--amber-soft)" : "transparent"} opacity={sel ? 0.7 : 1} />
              <rect x={cx - bw - 1} y={yOf(d.ini)} width={bw} height={H - B - yOf(d.ini)} fill={COLORS.ink} rx="2" />
              <rect x={cx + 1} y={yOf(d.ter)} width={bw} height={H - B - yOf(d.ter)} fill={COLORS.green} rx="2" />
              {d.ini > 0 && <text x={cx - bw / 2 - 1} y={yOf(d.ini) - 3} textAnchor="middle" fontSize="10" fill={COLORS.ink}>{d.ini}</text>}
              {d.ter > 0 && <text x={cx + bw / 2 + 1} y={yOf(d.ter) - 3} textAnchor="middle" fontSize="10" fill={COLORS.green}>{d.ter}</text>}
              <text x={cx} y={H - 10} textAnchor="middle" fontSize="11" fill={sel ? COLORS.ink : "var(--text-600)"} fontWeight={sel ? 700 : 400}>{d.label}</text>
              <title>{RES_MESES_LARGO[i] + " " + y + ": " + d.ini + " iniciados · " + d.ter + " terminados · " + d.act + " activos"}</title>
            </g>
          );
        })}
        <polyline points={line} fill="none" stroke={COLORS.amber} strokeWidth="2" />
        {data.map((d, i) => <circle key={i} cx={L + cw * i + cw / 2} cy={yOf(d.act)} r="3" fill={COLORS.amber} />)}
      </svg>
    </div>
  );
}

function RES_ProjectStatusDonut({ groups, total, active, onPick, unit }) {
  const u = unit || ["proyecto", "proyectos"];
  const size = 150, stroke = 20, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div className="flex items-center gap-6 flex-wrap">
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--steel-100)" strokeWidth={stroke} />
        {groups.filter((g) => g.count > 0).map((g, i) => {
          const frac = total ? g.count / total : 0;
          const dash = frac * c;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={g.color} strokeWidth={active === g.key ? stroke + 6 : stroke}
              strokeDasharray={dash + " " + (c - dash)} strokeDashoffset={-offset} transform={"rotate(-90 " + size / 2 + " " + size / 2 + ")"} style={{ cursor: "pointer" }} onClick={() => onPick(active === g.key ? "todos" : g.key)}>
              <title>{g.label + ": " + g.count + " (" + Math.round(frac * 100) + "%)"}</title>
            </circle>
          );
          offset += dash;
          return el;
        })}
        <text x={size / 2} y={size / 2 - 4} textAnchor="middle" fontSize="22" fontWeight="700" fill="var(--text-900)" fontFamily="var(--font-display)">{total}</text>
        <text x={size / 2} y={size / 2 + 14} textAnchor="middle" fontSize="10" fill="var(--text-400)">{total === 1 ? u[0] : u[1]}</text>
      </svg>
      <div className="space-y-1.5">
        {groups.map((g) => (
          <div key={g.key} className="flex items-center gap-2 text-xs" style={{ cursor: "pointer", fontWeight: active === g.key ? 700 : 400 }} onClick={() => onPick(active === g.key ? "todos" : g.key)}>
            <span style={{ width: 9, height: 9, borderRadius: 999, background: g.color, flexShrink: 0 }} />
            <span style={{ color: "var(--text-900)" }}>{g.label}</span>
            <span style={{ color: "var(--text-400)" }}>{g.count} · {total ? Math.round((g.count / total) * 100) : 0}%</span>
          </div>
        ))}
        {total === 0 && <p className="text-xs" style={{ color: "var(--text-400)" }}>No hay proyectos con estos filtros.</p>}
      </div>
    </div>
  );
}

function RES_ClientBars({ rows, active, onPick }) {

function ResumenModule({ proyectos, calItems, matProjects, actDocs, cajaFunds, cajaExpenses, otOrders, goTo }) {
  const now = new Date();
  const [fYear, setFYear] = useState(String(now.getFullYear()));
  const [fMonth, setFMonth] = useState("todos");
  const [fBasis, setFBasis] = useState("iniciados");
  const [fEstado, setFEstado] = useState("todos");
  const [fClient, setFClient] = useState("todos");
  const [sort, setSort] = useState({ key: "start", dir: "desc" });

  const allRows = useMemo(() => RES_buildRows(proyectos), [proyectos]);
  const years = useMemo(() => {
    const s = new Set([String(now.getFullYear())]);
    allRows.forEach((r) => { if (r.start) s.add(r.start.slice(0, 4)); if (r.end) s.add(r.end.slice(0, 4)); });
    return [...s].sort().reverse();
  }, [allRows]);
  const clients = useMemo(() => [...new Set(allRows.map((r) => r.client))].sort(), [allRows]);

  const baseRows = allRows.filter((r) => (fEstado === "todos" || r.estado === fEstado) && (fClient === "todos" || r.client === fClient));
  const periodRows = baseRows.filter((r) => {
    if (fYear === "todos" && fMonth === "todos") return true;
    if (fBasis === "iniciados") return RES_inMonth(r.start, fYear, fMonth);
    if (fBasis === "terminados") return RES_inMonth(r.end, fYear, fMonth);
    return RES_activeInMonth(r, fYear, fMonth);
  });
  const filtered = periodRows;
  const estadoRowsForDonut = allRows.filter((r) => (fClient === "todos" || r.client === fClient)).filter((r) => {
    if (fYear === "todos" && fMonth === "todos") return true;
    if (fBasis === "iniciados") return RES_inMonth(r.start, fYear, fMonth);
    if (fBasis === "terminados") return RES_inMonth(r.end, fYear, fMonth);
    return RES_activeInMonth(r, fYear, fMonth);
  });

  const iniciadosPeriodo = baseRows.filter((r) => RES_inMonth(r.start, fYear, fMonth)).length;
  const terminadosPeriodo = baseRows.filter((r) => RES_inMonth(r.end, fYear, fMonth)).length;
  const activosAhora = baseRows.filter((r) => r.estado !== "culminado").length;
  const criticos = filtered.filter((r) => r.estado === "critico").length;
  const conDur = filtered.filter((r) => r.dur !== null);
  const durProm = conDur.length ? Math.round(conDur.reduce((a, r) => a + r.dur, 0) / conDur.length) : null;
  const totPres = filtered.reduce((a, r) => a + r.presupuesto, 0);
  const totEjec = filtered.reduce((a, r) => a + r.ejecutado, 0);
  const avProm = filtered.length ? Math.round(filtered.reduce((a, r) => a + r.avance, 0) / filtered.length) : 0;
  const sinFecha = allRows.filter((r) => r.sinFechaControl).length;
  const termSinFecha = allRows.filter((r) => r.terminadoSinFecha).length;

  const estadoGroups = RES_ESTADOS.map((e) => ({ ...e, count: estadoRowsForDonut.filter((r) => r.estado === e.key).length }));

  const sorted = [...filtered].sort((a, b) => {
    const k = sort.key;
    const av = a[k], bv = b[k];
    let c;
    if (av === null || av === "" || av === undefined) c = (bv === null || bv === "" || bv === undefined) ? 0 : 1;
    else if (bv === null || bv === "" || bv === undefined) c = -1;
    else c = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv), "es");
    return sort.dir === "asc" ? c : -c;
  });
  const setSortKey = (key) => setSort((s) => s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" });

  const hayFiltros = fYear !== String(now.getFullYear()) || fMonth !== "todos" || fBasis !== "iniciados" || fEstado !== "todos" || fClient !== "todos";
  const reset = () => { setFYear(String(now.getFullYear())); setFMonth("todos"); setFBasis("iniciados"); setFEstado("todos"); setFClient("todos"); };
  const periodoTxt = (fMonth !== "todos" ? RES_MESES_LARGO[Number(fMonth) - 1] + " " : "") + (fYear !== "todos" ? fYear : (fMonth !== "todos" ? "(todos los años)" : "todo el histórico"));
  const estadoLabel = (k) => RES_ESTADOS.find((e) => e.key === k).label;

  const exportExcel = () => {
    const data = sorted.map((r) => ({
      Proyecto: r.name, Cliente: r.client, Estado: estadoLabel(r.estado), "Fecha inicio": r.start || "", "Fecha terminado": r.end || "",
      "Duración (días)": r.dur === null ? "" : r.dur, "Avance físico %": r.avance, "Presupuesto USD": r.presupuesto, "Ejecutado USD": r.ejecutado, "Ejecución %": r.ejecPct, "Riesgos abiertos": r.riesgos,

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Proyectos");
    XLSX.writeFile(wb, "resumen_proyectos_" + todayISO() + ".xlsx");
  };

  /* ---- otros módulos ---- */
  const crossings = useMemo(() => CAL_detectCrossings(calItems), [calItems]);
  const matPendientes = matProjects.filter((p) => !MAT_planosStats(p).completo || !MAT_materialesStats(p).completo).length;
  const actPendientes = actDocs.filter((d) => d.status !== "firmado").length;

  if (crossings.length > 0) alerts.push({ mod: "Calendario", text: `${crossings.length} cruce(s) de recursos detectados en el cronograma.` });
  const today = todayISO();
  matProjects.forEach((p) => {
    const ps = MAT_planosStats(p), ms = MAT_materialesStats(p);
    if (p.planosDueDate && p.planosDueDate < today && !ps.completo) alerts.push({ mod: "Materiales", text: `Planos de "${p.name}" vencidos sin aprobar.` });
    if (p.materialesDueDate && p.materialesDueDate < today && !ms.completo) alerts.push({ mod: "Materiales", text: `Materiales de "${p.name}" vencidos sin completar.` });
  });
  const staleDocs = actDocs.filter((d) => d.status !== "firmado" && d.date && daysBetween(d.date, today) >= 15);
  if (staleDocs.length) alerts.push({ mod: "Actas", text: `${staleDocs.length} documento(s) llevan 15 días o más sin firmarse.` });
  const cajaBalance = CAJA_computeBalance(cajaFunds, cajaExpenses);
  if (cajaBalance.totalFunds > 0 && cajaBalance.balance < cajaBalance.totalFunds * 0.2) {
    alerts.push({ mod: "Caja chica", text: `El saldo disponible (${money(cajaBalance.balance)}) está por debajo del 20% del total entregado histórico.` });
  }
  const otRows = OT_buildRows(otOrders || []).filter((r) => r.status !== "anulada");
  const otAbiertas = otRows.filter((r) => !r.terminal).length;
  const otAtras = otRows.filter((r) => r.late);
  const otSobre = otRows.filter((r) => r.over);
  const otPres = r2(otRows.reduce((a, r) => a + r.budget, 0));
  const otEjec = r2(otRows.reduce((a, r) => a + r.actual, 0));
  otAtras.forEach((r) => alerts.push({ mod: "Órdenes", text: `Orden N.º ${r.number} "${r.name}" atrasada respecto a su fecha de entrega.` }));
  otSobre.forEach((r) => alerts.push({ mod: "Órdenes", text: `Orden N.º ${r.number} "${r.name}" supera su presupuesto en ${money(r.variance)}.` }));
  const SECTIONS = [["proyectos", "Control de proyectos"], ["calendario", "Calendario"], ["materiales", "Planos y materiales"], ["actas", "Actas y órdenes"], ["ordenes", "Órdenes de trabajo"], ["caja", "Caja chica"]];

  const Th = ({ k, children, right }) => (
    <th className="font-medium pb-2 pr-3 cursor-pointer select-none whitespace-nowrap" style={{ textAlign: right ? "right" : "left" }} onClick={() => setSortKey(k)}>
      {children}{sort.key === k ? (sort.dir === "asc" ? " ▲" : " ▼") : ""}
    </th>
  );

  return (
    <div className="space-y-6">
      <div className="relative mb-2" style={{ overflow: "hidden" }}>
        <img src={getLogo()} alt="" aria-hidden="true" style={{ position: "absolute", top: -28, right: -16, width: 150, opacity: 0.07, transform: "rotate(-8deg)", pointerEvents: "none" }} />
        <div className="flex items-center gap-3 relative" style={{ zIndex: 1 }}>
          <div style={{ background: "#fff", border: "1px solid var(--steel-200)", borderRadius: 8, padding: 5, display: "flex", flexShrink: 0 }}>
            <img src={getLogo()} alt="Logo" style={{ height: 32, width: 32, objectFit: "contain" }} />
          </div>
          <div>
            <h2 className="text-xl font-semibold" style={{ fontFamily: "var(--font-display)", color: "var(--text-900)" }}>Resumen general</h2>
            <p className="text-sm" style={{ color: "var(--text-600)" }}>Control gerencial por proyecto y por mes · {fdate(todayISO())}</p>
          </div>
        </div>
      </div>

      <Panel>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <div>
            <label className="field-label">Año</label>
            <select className="field" value={fYear} onChange={(e) => setFYear(e.target.value)}>
              <option value="todos">Todos</option>
              {years.map((y) => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div>
            <label className="field-label">Mes</label>
            <select className="field" value={fMonth} onChange={(e) => setFMonth(e.target.value)}>
              <option value="todos">Todos</option>
              {RES_MESES_LARGO.map((m, i) => <option key={i} value={i + 1}>{m}</option>)}
            </select>
          </div>
          <div>
            <label className="field-label">Mostrar proyectos…</label>
            <select className="field" value={fBasis} onChange={(e) => setFBasis(e.target.value)}>
              <option value="iniciados">Iniciados en el período</option>
              <option value="terminados">Terminados en el período</option>
              <option value="activos">Activos durante el período</option>
            </select>
          </div>
          <div>
            <label className="field-label">Estado</label>
            <select className="field" value={fEstado} onChange={(e) => setFEstado(e.target.value)}>
              <option value="todos">Todos</option>
              {RES_ESTADOS.map((e) => <option key={e.key} value={e.key}>{e.label}</option>)}
            </select>
          </div>
          <div>
            <label className="field-label">Cliente</label>
            <select className="field" value={fClient} onChange={(e) => setFClient(e.target.value)}>
              <option value="todos">Todos</option>
              {clients.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div className="flex items-center justify-between gap-3 flex-wrap mt-3">
          <p className="text-xs" style={{ color: "var(--text-600)" }}>Período: <strong>{periodoTxt}</strong> · {filtered.length} proyecto(s) en el filtro</p>
          <div className="flex gap-2">
            {hayFiltros && <button onClick={reset} className="btn-ghost py-1 px-3 text-xs">Restablecer filtros</button>}
            <button onClick={exportExcel} className="btn-ghost py-1 px-3 text-xs">Exportar a Excel</button>
          </div>
        </div>
        {(sinFecha > 0 || termSinFecha > 0) && (
          <p className="text-xs mt-2" style={{ color: COLORS.amberDark }}>
            {sinFecha > 0 && `${sinFecha} proyecto(s) sin fecha de inicio de control (se usa la fecha de inicio del proyecto). `}
            {termSinFecha > 0 && `${termSinFecha} proyecto(s) culminado(s) sin fecha de terminado: no entran en el conteo mensual. `}
            Se completan editando el proyecto en Control de proyectos (lápiz junto al nombre).
          </p>
        )}
      </Panel>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard accent={COLORS.ink}>
          <p className="kpi-number">{iniciadosPeriodo}</p>
          <p className="kpi-label">Iniciados · {periodoTxt}</p>
        </KpiCard>
        <KpiCard accent={COLORS.green}>
          <p className="kpi-number">{terminadosPeriodo}</p>
          <p className="kpi-label">Terminados · {periodoTxt}</p>
        </KpiCard>
        <KpiCard accent={COLORS.steel}>
          <p className="kpi-number">{activosAhora}</p>
          <p className="kpi-label">En ejecución hoy{criticos > 0 ? " · " + criticos + " crítico(s) en el filtro" : ""}</p>
        </KpiCard>
        <KpiCard accent={COLORS.amber}>
          <p className="kpi-number">{durProm === null ? "—" : durProm + " d"}</p>
          <p className="kpi-label">Duración promedio (inicio → terminado)</p>
        </KpiCard>
        <KpiCard accent="var(--steel-300)">
          <p className="kpi-number">{avProm}%</p>
          <p className="kpi-label">Avance físico promedio del filtro</p>
        </KpiCard>
        <KpiCard accent="var(--steel-300)">
          <p className="kpi-number">{money(totPres)}</p>
          <p className="kpi-label">Presupuesto total del filtro</p>
        </KpiCard>
        <KpiCard accent={totPres > 0 && totEjec > totPres ? COLORS.red : "var(--steel-300)"}>
          <p className="kpi-number">{money(totEjec)}</p>
          <p className="kpi-label">Ejecutado · {totPres ? Math.round((totEjec / totPres) * 100) : 0}% del presupuesto</p>
        </KpiCard>
        <KpiCard accent={cajaBalance.balance < cajaBalance.totalFunds * 0.2 ? COLORS.red : COLORS.green}>
          <p className="kpi-number">{money(cajaBalance.balance)}</p>
          <p className="kpi-label">Saldo disponible en caja chica</p>
        </KpiCard>
      </div>

      <Panel>
        <PanelHeader title="Proyectos por mes — iniciados, terminados y activos" />
        <RES_MonthlyChart rows={baseRows} year={fYear} month={fMonth} onPickMonth={(m, y) => { setFMonth(String(m)); setFYear(String(y)); }} />
      </Panel>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Panel>
          <PanelHeader title="Estado de los proyectos (clic para filtrar)" />
          <RES_ProjectStatusDonut groups={estadoGroups} total={estadoRowsForDonut.length} active={fEstado} onPick={setFEstado} />
        </Panel>
        <Panel>
          <PanelHeader title="Proyectos por cliente (clic para filtrar)" />
          <RES_ClientBars rows={estadoRowsForDonut} active={fClient} onPick={setFClient} />
        </Panel>
      </div>

      <Panel>
        <PanelHeader title="Avance físico vs. presupuesto ejecutado por proyecto" />
        <RES_ProjectBars rows={filtered} onOpen={(id) => goTo("proyectos", id)} />
      </Panel>

      <Panel>
        <PanelHeader title="Detalle por proyecto" />
        {sorted.length ? (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-xs" style={{ color: "var(--text-400)" }}>
                  <Th k="name">Proyecto</Th><Th k="client">Cliente</Th><Th k="estado">Estado</Th><Th k="start">Inicio</Th><Th k="end">Terminado</Th>
                  <Th k="dur" right>Días</Th><Th k="avance" right>Avance</Th><Th k="presupuesto" right>Presupuesto</Th><Th k="ejecPct" right>Ejec.</Th><Th k="riesgos" right>Riesgos</Th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((r) => {
                  const est = RES_ESTADOS.find((e) => e.key === r.estado);
                  return (
                    <tr key={r.id} onClick={() => goTo("proyectos", r.id)} className="cursor-pointer" style={{ borderTop: "1px solid var(--steel-100)" }}>
                      <td className="py-2 pr-3 font-medium" style={{ color: "var(--text-900)" }}>{r.name}</td>
                      <td className="py-2 pr-3" style={{ color: "var(--text-600)" }}>{r.client}</td>
                      <td className="py-2 pr-3 whitespace-nowrap"><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 999, background: est.color, marginRight: 6 }} />{est.label.replace(", sin alertas", "")}</td>
                      <td className="py-2 pr-3 whitespace-nowrap">{fdate(r.start)}</td>
                      <td className="py-2 pr-3 whitespace-nowrap">{fdate(r.end)}</td>
                      <td className="py-2 pr-3 text-right">{r.dur === null ? "—" : r.dur}</td>
                      <td className="py-2 pr-3 text-right">{r.avance}%</td>
                      <td className="py-2 pr-3 text-right whitespace-nowrap">{money(r.presupuesto)}</td>
                      <td className="py-2 pr-3 text-right" style={{ color: r.ejecPct - r.avance > 15 ? COLORS.red : "var(--text-900)" }}>{r.ejecPct}%</td>
                      <td className="py-2 pr-3 text-right">{r.riesgos}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
          <p className="text-sm" style={{ color: "var(--text-400)" }}>No hay proyectos con estos filtros.</p>
        )}
      </Panel>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard accent={otAtras.length || otSobre.length ? COLORS.red : COLORS.green}>
          <p className="kpi-number">{otAbiertas}</p>
          <p className="kpi-label">Órdenes de trabajo abiertas · {otAtras.length} atrasada(s) · {otSobre.length} sobre presupuesto</p>
          <p className="text-xs mt-1" style={{ color: "var(--text-400)" }}>Presupuesto {money(otPres)} · ejecutado {money(otEjec)}</p>
        </KpiCard>
        <KpiCard accent={crossings.length > 0 ? COLORS.red : COLORS.green}>
          <p className="kpi-number">{crossings.length}</p>
          <p className="kpi-label">Cruces en el cronograma</p>
        </KpiCard>
        <KpiCard accent={matPendientes > 0 ? COLORS.amber : COLORS.green}>
          <p className="kpi-number">{matPendientes}</p>
          <p className="kpi-label">Proyectos con planos/materiales pendientes</p>
        </KpiCard>
        <KpiCard accent={actPendientes > 0 ? COLORS.amber : COLORS.green}>
          <p className="kpi-number">{actPendientes}</p>
          <p className="kpi-label">Documentos pendientes de firma</p>
        </KpiCard>
      </div>

      <Panel>
        <PanelHeader title="Puntos de atención" />
        {alerts.length ? (
          <ul className="space-y-2 text-sm">
            {alerts.map((a, i) => (
              <li key={i} style={{ color: "var(--text-900)" }}>
                <span className="risk-pill" style={{ background: "var(--steel-100)", color: "var(--text-600)", marginRight: 8 }}>{a.mod}</span>{a.text}
              </li>
            ))}
          </ul>
        ) : (
          <p className="text-sm" style={{ color: "var(--text-400)" }}>No hay puntos críticos de atención por el momento.</p>
        )}
      </Panel>

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
        {SECTIONS.map(([key, label]) => (
          <button key={key} onClick={() => goTo(key)} className="panel text-left p-4" style={{ cursor: "pointer" }}>
            <p className="text-sm font-medium" style={{ color: "var(--text-900)" }}>{label}</p>
            <p className="text-xs mt-1" style={{ color: "var(--text-400)" }}>Ir al módulo →</p>
          </button>
        ))}
      </div>
    </div>
  );
}

function MasterSidebar({ section, setSection, open, onClose, syncStatus, onRefreshAll, onOpenSettings }) {
  const SECTIONS = [
    ["resumen", "Resumen general"],
    ["proyectos", "Control de proyectos"],
    ["calendario", "Calendario"],
    ["materiales", "Planos y materiales"],

        <div className="px-5 pt-6 pb-4" style={{ paddingTop: "calc(1.5rem + env(safe-area-inset-top))" }}>
          <div className="flex items-center gap-3 mb-3">

              <img src={getLogo()} alt="Logo" style={{ height: 38, width: 38, objectFit: "contain" }} />
            </div>
            <div className="min-w-0">
              <h1 className="text-sm font-semibold leading-tight truncate" style={{ fontFamily: "var(--font-display)", color: "#fff" }}>Soluciones Industriales GAM</h1>
              <p className="text-xs" style={{ color: "var(--ink-sub)" }}>Panel gerencial</p>
            </div>
          </div>
          <p className="text-xs" style={{ color: "var(--ink-sub)" }}>Todos los módulos en un solo lugar</p>
        </div>
        <nav className="px-3 space-y-1">
          {SECTIONS.map(([key, label]) => (
            <button key={key} onClick={() => { setSection(key); onClose && onClose(); }} className="w-full text-left px-3 py-2 rounded text-sm" style={{ background: section === key ? "var(--ink-800)" : "transparent", color: section === key ? "#fff" : "var(--ink-sub)" }}>
              {label}
            </button>
          ))}
