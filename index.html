function getLogo() { try { return window.localStorage.getItem(LOGO_KEY) || COMPANY_LOGO; } catch (e) { return COMPANY_LOGO; } }
function setLogo(dataUrl) { window.localStorage.setItem(LOGO_KEY, dataUrl); }
function clearLogo() { window.localStorage.removeItem(LOGO_KEY); }
function hasCustomLogo() { try { return !!window.localStorage.getItem(LOGO_KEY); } catch (e) { return false; } }

function SetupScreen({ onSave, initial, onCancel }) {
  const [url, setUrl] = useState((initial && initial.url) || "");
  const [token, setToken] = useState((initial && initial.token) || "");
  const [testing, setTesting] = useState(false);
  const [error, setError] = useState("");
  const [logo, setLogoState] = useState(getLogo());
  const onLogoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 900 * 1024) { setError("La imagen es muy pesada. Usa un logo de menos de 900 KB."); return; }
    const reader = new FileReader();
    reader.onload = () => { setLogo(reader.result); setLogoState(reader.result); setError(""); };
    reader.readAsDataURL(file);
  };
  const removeLogo = () => { clearLogo(); setLogoState(getLogo()); };
  const submit = async (e) => {
    e.preventDefault();
    if (!url.trim()) { setError("Pega la URL de tu Web App de Google Apps Script."); return; }
    setTesting(true); setError("");
    try {
      const res = await fetch(url.trim() + "?token=" + encodeURIComponent(token));
      const data = await res.json();
      if (data.error) { setError("La hoja respondió con un error (" + data.error + "). Revisa la clave e inténtalo de nuevo."); setTesting(false); return; }
      setSyncConfig({ url: url.trim(), token: token.trim() });
      onSave();
    } catch (err) {
      setError("No se pudo conectar. Revisa la URL y tu conexión a internet.");
    }
    setTesting(false);
  };
  return (
    <div className="max-w-lg mx-auto py-16 px-6">
      <h2 className="text-xl font-semibold mb-1" style={{ fontFamily: "var(--font-display)", color: "var(--text-900)" }}>Conectar con Google Sheets</h2>
      <p className="text-sm mb-6" style={{ color: "var(--text-600)" }}>Pega la URL de tu Web App de Apps Script y la clave que definiste, para conectar este dispositivo a la hoja compartida. Solo se hace una vez por dispositivo.</p>
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="field-label">URL de la Web App</label>
          <input className="field" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/AKfycb.../exec" />
        </div>
        <div>
          <label className="field-label">Clave (token)</label>
          <input className="field" value={token} onChange={(e) => setToken(e.target.value)} placeholder="La clave que definiste en el script" />
        </div>
        {error && <p className="text-xs" style={{ color: COLORS.red }}>{error}</p>}
        <div className="flex gap-3">
          <button className="btn-primary" disabled={testing}>{testing ? "Probando conexión…" : "Conectar"}</button>
          {onCancel && <button type="button" onClick={onCancel} className="btn-ghost">Cancelar</button>}
        </div>
      </form>
      <div className="mt-8 pt-6" style={{ borderTop: "1px solid var(--steel-200)" }}>
        <h3 className="text-sm font-semibold mb-1" style={{ fontFamily: "var(--font-display)", color: "var(--text-900)" }}>Logotipo de la empresa</h3>
        <p className="text-xs mb-3" style={{ color: "var(--text-600)" }}>La app ya incluye el logo de Soluciones Industriales GAM de forma predeterminada. Si quieres reemplazarlo en este dispositivo, sube otra imagen.</p>
        <div className="flex items-center gap-4">
          <img src={logo} alt="Logo" style={{ height: 44, maxWidth: 160, objectFit: "contain" }} />
          <label className="btn-ghost text-xs cursor-pointer" style={{ display: "inline-block" }}>
            Subir otro logo
            <input type="file" accept="image/*" onChange={onLogoFile} style={{ display: "none" }} />
          </label>
          {hasCustomLogo() && <button type="button" onClick={removeLogo} className="text-xs" style={{ color: COLORS.red }}>Restaurar original</button>}
        </div>
      </div>
    </div>
  );
}


/* ---------------------------------- api generica multi-dataset ---------------------------------- */

async function apiGet(dataset) {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.url) { const err = new Error("not_configured"); err.code = "not_configured"; throw err; }
  let res;
  try { res = await fetch(cfg.url + "?token=" + encodeURIComponent(cfg.token || "") + "&dataset=" + encodeURIComponent(dataset)); }
  catch (networkErr) { const err = new Error("network_error"); err.code = "network_error"; throw err; }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error("bad_response"); err.code = "bad_response"; throw err; }
  if (data.error) { const err = new Error(data.error); err.code = data.error; throw err; }
  return data.projects || [];
}

async function apiSet(dataset, projects) {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.url) { const err = new Error("not_configured"); err.code = "not_configured"; throw err; }
  let res;
  try { res = await fetch(cfg.url, { method: "POST", body: JSON.stringify({ token: cfg.token || "", dataset, projects }) }); }
  catch (networkErr) { const err = new Error("network_error"); err.code = "network_error"; throw err; }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error("bad_response"); err.code = "bad_response"; throw err; }
  if (data.error) { const err = new Error(data.error); err.code = data.error; throw err; }
  return data;
}

async function apiUploadFile(file) {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.url) { const err = new Error("not_configured"); err.code = "not_configured"; throw err; }
  const base64Data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve((reader.result || "").split(",")[1] || "");
    reader.onerror = () => reject(new Error("read_failed"));
    reader.readAsDataURL(file);
  });
  let res;
  try {
    res = await fetch(cfg.url, { method: "POST", body: JSON.stringify({ token: cfg.token || "", action: "uploadFile", filename: file.name, mimeType: file.type || "application/pdf", base64Data }) });
  } catch (networkErr) { const err = new Error("network_error"); err.code = "network_error"; throw err; }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error("bad_response"); err.code = "bad_response"; throw err; }
  if (data.error) { const err = new Error(data.error); err.code = data.error; throw err; }
  return data;
}

/* ---------------------------------- hook generico de sincronizacion por dataset ---------------------------------- */

function useDatasetSync(dataset, initialState, extractFn, wrapFn) {
  const [state, setState] = useState(initialState);
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);
  const skipNextSave = useRef(false);
  const hasLoadedOnce = useRef(false);
  const [needsSetup, setNeedsSetup] = useState(false);

  const load = useCallback(async () => {
    setSyncError("");
    try {
      const arr = await apiGet(dataset);
      skipNextSave.current = true;
      setState(extractFn(arr));
      setLastSynced(new Date());
      hasLoadedOnce.current = true;
      setNeedsSetup(false);
    } catch (e) {
      if (e.code === "not_configured") { setNeedsSetup(true); }
      else { skipNextSave.current = true; setSyncError("No se pudo sincronizar. Revisa tu conexión e inténtalo de nuevo."); }
    } finally {
      setLoaded(true);
    }
  }, [dataset]);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!loaded || !hasLoadedOnce.current) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    (async () => {
      try {
        await apiSet(dataset, wrapFn(state));
        setLastSynced(new Date());
        setSyncError("");
      } catch (e) {
        setSyncError("No se pudo guardar. Tus cambios quedan en este dispositivo hasta reconectar.");
      }
    })();
    // eslint-disable-next-line
  }, [state, loaded]);

  return { state, setState, loaded, syncError, lastSynced, reload: load, needsSetup };
}

/* ---------------------------------- utilidades genericas ---------------------------------- */

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
const toISO = (date) => date.toISOString().slice(0, 10);
const todayISO = () => toISO(new Date());

function money(n) {
  return new Intl.NumberFormat("es-EC", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
}
function DecimalInput({ value, onChange, className, placeholder, style }) {
  const [text, setText] = useState(value === undefined || value === null ? "" : String(value));
  useEffect(() => {
    const cur = parseFloat(String(text).replace(",", "."));
    const val = parseFloat(value);
    if (cur !== val && !(text === "" && (value === "" || value === 0 || value === undefined || value === null))) setText(value === undefined || value === null ? "" : String(value));
  }, [value]);
  return (
    <input type="text" inputMode="decimal" className={className} style={style} placeholder={placeholder} value={text}
      onChange={(e) => { const t = e.target.value; if (!/^\d*[.,]?\d*$/.test(t)) return; setText(t); onChange(t === "" ? "" : t.replace(",", ".")); }} />
  );
}
function fdate(iso) {
  if (!iso) return "—";
  return new Intl.DateTimeFormat("es-EC", { day: "2-digit", month: "short", year: "numeric" }).format(new Date(iso + "T00:00:00"));
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function riskLevel(prob, impact) {
  const score = Number(prob) * Number(impact);
  if (score >= 6) return "alto";
  if (score >= 3) return "medio";
  return "bajo";
}
const RISK_LEVEL_COLOR = { alto: COLORS.red, medio: COLORS.amber, bajo: COLORS.green };

function ProgressRing({ value, size = 76, stroke = 8, color, track = COLORS.steelLight }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (Math.min(Math.max(value, 0), 100) / 100) * c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset .6s ease" }} />
    </svg>
  );
}

function CP_buildPhases(startDateStr, totalWeeks, totalBudget) {
  let cursor = new Date(startDateStr + "T00:00:00");
  return CP_PHASE_TEMPLATE.map((tpl, i) => {
    const weeks = Math.max(1, Math.round(totalWeeks * (tpl.weight / 100)));
    const plannedStart = new Date(cursor);
    const plannedEnd = addDays(plannedStart, weeks * 7 - 1);
    cursor = addDays(plannedEnd, 1);
    return {
      id: uid(),
      name: tpl.name,
      shortName: tpl.shortName,
      weight: tpl.weight,
      status: i === 0 ? "en_curso" : "pendiente",
      progress: 0,
      plannedStart: toISO(plannedStart),
      plannedEnd: toISO(plannedEnd),
      actualStart: i === 0 ? todayISO() : "",
      actualEnd: "",
      budgetPlanned: Math.round(totalBudget * (tpl.weight / 100) * 100) / 100,
      budgetActual: 0,
      responsible: "",
      deliverables: tpl.deliverables.map((d) => ({ id: uid(), name: d, done: false })),
    };
  });
}

function CP_computeProgress(phases) {
  return Math.round(phases.reduce((acc, p) => acc + p.weight * (p.progress / 100), 0));
}
function CP_computeBudgetTotals(phases) {
  const planned = phases.reduce((a, p) => a + (Number(p.budgetPlanned) || 0), 0);
  const actual = phases.reduce((a, p) => a + (Number(p.budgetActual) || 0), 0);
  return { planned, actual };
}
function CP_isPhaseLate(phase) {
  if (phase.status === "completado") return false;
  if (!phase.plannedEnd) return false;
  return new Date(phase.plannedEnd + "T00:00:00") < new Date(new Date().toDateString());
}

function CP_isProjectComplete(project) {
  return project.phases.length > 0 && project.phases.every((p) => p.status === "completado");
}

function CP_projectDates(project) {
  const phases = project.phases || [];
  const complete = CP_isProjectComplete(project);
  const start = project.ctrlStart || project.startDate || (phases[0] ? phases[0].plannedStart : "") || "";
  let end = project.ctrlEnd || "";
  if (!end && complete) end = phases.map((p) => p.actualEnd || "").filter(Boolean).sort().pop() || "";
  return { start, end, hasCtrlStart: !!project.ctrlStart, hasCtrlEnd: !!project.ctrlEnd };
}
function CP_projectState(project) {
  if (CP_isProjectComplete(project) || project.ctrlEnd) return "culminado";
  const level = CP_computeRag(project).level;
  return level === "rojo" ? "critico" : level === "amarillo" ? "atencion" : "en_curso";
}

function CP_computeRag(project) {
  const lateCount = project.phases.filter(CP_isPhaseLate).length;
  const { planned, actual } = CP_computeBudgetTotals(project.phases);
  const avanceFisico = CP_computeProgress(project.phases);
  const avancePresupuestario = planned > 0 ? Math.round((actual / planned) * 100) : 0;
  const openRisks = (project.risks || []).filter((r) => r.status === "abierto");
  const highOpen = openRisks.filter((r) => riskLevel(r.prob, r.impact) === "alto").length;
  const medOpen = openRisks.filter((r) => riskLevel(r.prob, r.impact) === "medio").length;
  const budgetGap = avancePresupuestario - avanceFisico;
  let level = "verde";
  if (highOpen > 0 || lateCount >= 2 || budgetGap > 15) level = "rojo";
  else if (lateCount === 1 || budgetGap > 5 || medOpen > 0) level = "amarillo";
  return { level, lateCount, avanceFisico, avancePresupuestario, budgetGap, highOpen, medOpen, planned, actual };
}

function CP_buildMilestones(project) {
  const fromPhases = project.phases.map((p) => ({
    id: "phase-" + p.id,
    name: "Fin de " + p.name,
    date: p.plannedEnd,
    done: p.status === "completado",
    responsible: p.responsible || "",
    custom: false,
  }));
  const custom = (project.milestones || []).map((m) => ({ ...m, custom: true }));
  return [...fromPhases, ...custom].sort((a, b) => new Date(a.date) - new Date(b.date));
}

function CP_recommendations(project, rag) {
  const out = [];
  if (rag.lateCount > 0) {
    out.push(`Revisar el cronograma: ${rag.lateCount} fase(s) están fuera de la fecha planificada. Evaluar reasignación de recursos o renegociar el plazo con el cliente.`);
  }
  if (rag.budgetGap > 5) {
    out.push("El gasto ejecutado avanza más rápido que el avance físico del proyecto. Se recomienda una revisión de costos y control de cambios antes de iniciar la siguiente fase.");
  }
  if (rag.highOpen > 0) {
    out.push(`Existen ${rag.highOpen} riesgo(s) de nivel alto sin mitigar. Priorizar un plan de tratamiento antes de continuar.`);
  }
  if (rag.medOpen > 0 && rag.highOpen === 0) {
    out.push(`Hay ${rag.medOpen} riesgo(s) de nivel medio abiertos. Mantenerlos en revisión periódica.`);
  }
  if (out.length === 0) {
    out.push("El proyecto avanza dentro de los parámetros planificados. Mantener el seguimiento habitual y actualizar el avance semanalmente.");
  }
  return out;
}

function CP_analysisPoints(project) {
  const points = [];
  const byShort = {};
  project.phases.forEach((p) => { byShort[p.shortName] = p; });
  const procura = byShort["Procura"], fab = byShort["Fabricación"], montaje = byShort["Montaje"], pruebas = byShort["Pruebas"];
  if (procura && procura.status !== "completado" && procura.progress >= 40) {
    points.push("Procura muestra avance intermedio o mayor: confirmar que los ítems de mayor tiempo de entrega (importaciones, componentes especiales) estén asegurados y no solo las órdenes de menor complejidad — ahí suele concentrarse el riesgo real.");
  }
  if (fab && fab.status === "en_curso" && procura && procura.status !== "completado") {
    points.push("Fabricación y Procura corren en paralelo: validar que el taller no dependa de materiales aún no confirmados, para evitar paradas de línea por falta de insumos.");
  }
  if (montaje && montaje.status === "pendiente" && fab && (fab.progress > 0 || fab.status !== "pendiente")) {
    points.push("Montaje aún no inicia: adelantar logística, permisos de sitio y disponibilidad de cuadrillas en paralelo a Fabricación, para no perder tiempo cuando esa fase cierre.");
  }
  if (pruebas && pruebas.status === "pendiente") {
    points.push("Gestionar con el cliente la ventana de pruebas (FAT/SAT) con anticipación; la disponibilidad de planta del cliente rara vez es inmediata.");
  }
  const openRisks = (project.risks || []).filter((r) => r.status === "abierto");
  if (openRisks.length > 0) {
    points.push(`Hay ${openRisks.length} riesgo(s) abierto(s) sin cerrar. Revisar su plan de mitigación antes del próximo hito relevante.`);
  }
  const overBudgetPhases = project.phases.filter((p) => p.budgetActual > p.budgetPlanned * 1.05);
  if (overBudgetPhases.length > 0) {
    points.push(`${overBudgetPhases.length} fase(s) muestran gasto por encima de lo planificado (${overBudgetPhases.map((p) => p.shortName).join(", ")}). Validar si es un adelanto de compras o una desviación real de costos.`);
  }
  const noResponsible = project.phases.filter((p) => p.status !== "pendiente" && !p.responsible);
  if (noResponsible.length > 0) {
    points.push(`${noResponsible.length} fase(s) activas o completadas no tienen responsable asignado. Definir accountability clara por fase.`);
  }
  if (points.length === 0) {
    points.push("No se identifican puntos críticos adicionales por el momento. Mantener el ritmo de seguimiento habitual.");
  }
  return points;
}

function CP_PhaseFlow({ phases, expandedId, setExpandedId, onUpdatePhase, onToggleDeliverable }) {
  return (

      <div className="flex overflow-x-auto pb-2">
        {phases.map((p, i) => {
          const meta = CP_STATUS_META[p.status];
          const late = CP_isPhaseLate(p);
          const isExpanded = expandedId === p.id;
          const nextP = phases[i + 1];
          const connectorColor = p.status === "completado" ? COLORS.green : p.status === "en_curso" ? COLORS.amber : "var(--steel-300)";
          return (
            <div key={p.id} className="flex items-start" style={{ minWidth: i === phases.length - 1 ? 96 : 128 }}>
              <button onClick={() => setExpandedId(isExpanded ? null : p.id)} className="flex flex-col items-center gap-2 shrink-0" style={{ width: 96 }}>
                <div className="phase-node" style={{
                  background: p.status === "pendiente" ? "#fff" : meta.fg,
                  borderColor: late ? COLORS.red : (p.status === "pendiente" ? "var(--steel-300)" : meta.fg),
                  borderWidth: late ? 2 : 1,
                }}>
                  {p.status === "completado" ? <CheckCircle2 size={16} color="#fff" /> : late ? <AlertTriangle size={14} color={COLORS.red} /> : p.status === "en_curso" ? <span className="text-xs font-semibold" style={{ color: "#fff" }}>{p.progress}%</span> : <Circle size={10} color="var(--steel-300)" />}

                  <option value="en_curso">En curso</option>
                  <option value="completado">Completado</option>
                </select>
              </div>
              <div>
                <label className="field-label">Avance ({p.progress}%)</label>

/* ---------------------------------- gráficos ---------------------------------- */

function CP_SCurveChart({ phases }) {
  const data = useMemo(() => {
    let cumP = 0, cumR = 0;
    return phases.map((p) => {
      cumP += p.weight;
      cumR += p.weight * (p.progress / 100);
      return { name: p.shortName, planificado: Math.round(cumP), real: Math.round(cumR) };
    });
  }, [phases]);
  const W = 620, H = 230, padL = 34, padR = 14, padT = 18, padB = 26;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = data.length;
  const xAt = (i) => padL + (n <= 1 ? chartW / 2 : (i / (n - 1)) * chartW);
  const yAt = (v) => padT + chartH - (Math.min(Math.max(v, 0), 100) / 100) * chartH;
  const pathFor = (key) => data.map((d, i) => (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + " " + yAt(d[key]).toFixed(1)).join(" ");
  const ticks = [0, 25, 50, 75, 100];
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%" height="230" role="img" aria-label="Curva S de avance planificado versus real">
      {ticks.map((t) => (
        <g key={t}>
          <line x1={padL} x2={W - padR} y1={yAt(t)} y2={yAt(t)} stroke="var(--steel-100)" />
          <text x={padL - 6} y={yAt(t) + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{t}%</text>
        </g>
      ))}
      {data.map((d, i) => (
        <text key={i} x={xAt(i)} y={H - 6} textAnchor="middle" fontSize="9" fill="var(--text-400)">{d.name}</text>
      ))}
      <path d={pathFor("planificado")} fill="none" stroke={COLORS.steel} strokeWidth="2" strokeDasharray="4 3" />
      <path d={pathFor("real")} fill="none" stroke={COLORS.amber} strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(d.real)} r="3.2" fill={COLORS.amber}>
          <title>{d.name + ": " + d.real + "% real (plan " + d.planificado + "%)"}</title>
        </circle>
      ))}
      <line x1={W - 172} x2={W - 156} y1="12" y2="12" stroke={COLORS.steel} strokeWidth="2" strokeDasharray="4 3" />
      <text x={W - 152} y="15" fontSize="9" fill="var(--text-600)">Planificado</text>
      <line x1={W - 82} x2={W - 66} y1="12" y2="12" stroke={COLORS.amber} strokeWidth="2.5" />
      <text x={W - 62} y="15" fontSize="9" fill="var(--text-600)">Real</text>
    </svg>
  );
}

function CP_BudgetChart({ phases }) {
  const data = phases.map((p) => ({ name: p.shortName, planificado: p.budgetPlanned, real: p.budgetActual }));
  const W = 620, H = 230, padL = 44, padR = 14, padT = 18, padB = 26;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const max = Math.max(1, ...data.flatMap((d) => [d.planificado, d.real]));
  const n = data.length;
  const slot = chartW / n;
  const barW = slot * 0.28;
  const gap = slot * 0.08;
  const x0 = (i) => padL + i * slot + (slot - (barW * 2 + gap)) / 2;
  const hAt = (v) => (Math.max(v, 0) / max) * chartH;
  const ticks = [0, 0.5, 1].map((f) => Math.round(max * f));
  const fmtK = (v) => "$" + Math.round(v / 1000) + "k";
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%" height="230" role="img" aria-label="Presupuesto planificado versus real por fase">
      {ticks.map((t, i) => {
        const y = padT + chartH - (t / max) * chartH;
        return (
          <g key={i}>
            <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--steel-100)" />
            <text x={padL - 6} y={y + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{fmtK(t)}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const hp = hAt(d.planificado), hr = hAt(d.real);
        const over = d.real > d.planificado * 1.05;
        return (
          <g key={i}>
            <rect x={x0(i)} y={padT + chartH - hp} width={barW} height={hp} fill={COLORS.steel} rx="2">
              <title>{d.name + " planificado: " + money(d.planificado)}</title>
            </rect>
            <rect x={x0(i) + barW + gap} y={padT + chartH - hr} width={barW} height={hr} fill={over ? COLORS.red : COLORS.amber} rx="2">
              <title>{d.name + " real: " + money(d.real)}</title>
            </rect>
            <text x={padL + i * slot + slot / 2} y={H - 6} textAnchor="middle" fontSize="9" fill="var(--text-400)">{d.name}</text>
          </g>
        );
      })}
      <rect x={W - 172} y="7" width="9" height="9" fill={COLORS.steel} />
      <text x={W - 159} y="15" fontSize="9" fill="var(--text-600)">Planificado</text>
      <rect x={W - 82} y="7" width="9" height="9" fill={COLORS.amber} />
      <text x={W - 69} y="15" fontSize="9" fill="var(--text-600)">Real</text>
    </svg>
  );
}

function CP_MilestonesTimeline({ milestones, onAdd, onDelete }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", date: todayISO(), responsible: "" });
  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    onAdd(form);
    setForm({ name: "", date: todayISO(), responsible: "" });
    setShowForm(false);
  };
  return (
    <div>
      <div className="space-y-3">
        {milestones.map((m) => {
          const vencido = !m.done && new Date(m.date + "T00:00:00") < new Date(new Date().toDateString());
          const color = m.done ? COLORS.green : vencido ? COLORS.red : "var(--steel-300)";
          return (
            <div key={m.id} className="flex items-center gap-3">
              <span style={{ width: 9, height: 9, borderRadius: 999, background: color, flexShrink: 0 }} />
              <p className="text-sm flex-1" style={{ color: "var(--text-900)" }}>{m.name}</p>
              {m.responsible && <p className="text-xs" style={{ color: "var(--text-400)" }}>{m.responsible}</p>}
              <p className="text-xs" style={{ color: vencido ? COLORS.red : "var(--text-400)" }}>{fdate(m.date)}</p>
              {m.custom && <button aria-label="Eliminar hito" onClick={() => onDelete(m.id)} style={{ color: "var(--text-400)" }}><Trash2 size={12} /></button>}
            </div>
          );
        })}
      </div>
      {showForm ? (
        <form onSubmit={submit} className="mt-3 flex gap-2 items-end flex-wrap">
          <input className="field" style={{ minWidth: 180 }} placeholder="Nombre del hito" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          <input type="date" className="field" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          <input className="field" style={{ minWidth: 140 }} placeholder="Responsable" value={form.responsible} onChange={(e) => setForm({ ...form, responsible: e.target.value })} />
          <button className="btn-primary py-1.5 px-3 text-xs">Agregar</button>
          <button type="button" onClick={() => setShowForm(false)} className="btn-ghost py-1.5 px-3 text-xs">Cancelar</button>
        </form>
      ) : (
        <button onClick={() => setShowForm(true)} className="btn-ghost mt-3 text-xs"><Plus size={13} className="inline -mt-0.5 mr-1" />Agregar hito</button>
      )}
    </div>
  );
}

  const recs = CP_recommendations(project, rag);

  const criticalRisks = (project.risks || []).filter((r) => r.status === "abierto" && riskLevel(r.prob, r.impact) === "alto");

      <div className="relative mb-6" style={{ overflow: "hidden" }}>

        <div className="flex items-center justify-between relative" style={{ zIndex: 1 }}>
          <div className="flex items-center gap-3 min-w-0">
            <div style={{ background: "#fff", border: "1px solid var(--steel-200)", borderRadius: 8, padding: 5, display: "flex", flexShrink: 0 }}>
              <img src={getLogo()} alt="Logo" style={{ height: 32, width: 32, objectFit: "contain" }} />
            </div>
            <div className="min-w-0">
              <h2 className="text-xl font-semibold truncate" style={{ fontFamily: "var(--font-display)", color: "var(--text-900)" }}>Informe gerencial</h2>
              <p className="text-sm truncate" style={{ color: "var(--text-600)" }}>{project.name} · {fdate(todayISO())}</p>
            </div>
          </div>
          <button onClick={() => window.print()} className="btn-ghost no-print shrink-0"><Printer size={14} className="inline -mt-0.5 mr-1.5" />Imprimir</button>
        </div>
        <div className="flex items-center gap-2 mt-4 relative flex-wrap" style={{ zIndex: 1 }}>
          {CP_isProjectComplete(project) && (
            <span className="text-xs font-semibold uppercase inline-flex items-center gap-1 px-2 py-0.5 rounded" style={{ color: COLORS.green, background: "var(--green-soft)", letterSpacing: "0.04em" }}>
              <CheckCircle2 size={11} color={COLORS.green} />Culminado
            </span>
          )}
          <RagDot level={rag.level} />
          <span className="text-sm" style={{ color: "var(--text-400)" }}>· Avance físico {rag.avanceFisico}% · Ejecución presupuestaria {rag.avancePresupuestario}%</span>
        </div>
      </div>
      <Panel className="mb-6">
        <PanelHeader title="Resumen ejecutivo" />
        <p className="text-sm leading-relaxed" style={{ color: "var(--text-900)" }}>
          El proyecto <strong>{project.name}</strong> para <strong>{project.client}</strong> registra un avance físico del <strong>{rag.avanceFisico}%</strong>,
          con una ejecución presupuestaria del <strong>{rag.avancePresupuestario}%</strong> sobre un presupuesto planificado de <strong>{money(rag.planned)}</strong>.
          {rag.lateCount > 0 ? ` Se identifican ${rag.lateCount} fase(s) con retraso respecto al cronograma planificado.` : " El cronograma se mantiene dentro de lo planificado."}
          {criticalRisks.length > 0 ? ` Existen ${criticalRisks.length} riesgo(s) de nivel alto que requieren atención inmediata.` : " No hay riesgos de nivel alto abiertos en este momento."}
        </p>
      </Panel>
      <Panel className="mb-6">
        <PanelHeader title="Estado por fase" />
        <table className="w-full text-sm">
          <thead><tr className="text-left" style={{ color: "var(--text-400)" }}>
            <th className="font-medium pb-2">Fase</th><th className="font-medium pb-2">Responsable</th><th className="font-medium pb-2">Estado</th><th className="font-medium pb-2">Avance</th><th className="font-medium pb-2">Fin planificado</th><th className="font-medium pb-2">Presupuesto</th>
          </tr></thead>
          <tbody>
            {project.phases.map((p) => (
              <tr key={p.id} style={{ borderTop: "1px solid var(--steel-100)" }}>
                <td className="py-1.5" style={{ color: "var(--text-900)" }}>{p.name}</td>
                <td className="py-1.5" style={{ color: "var(--text-600)" }}>{p.responsible || "—"}</td>
                <td className="py-1.5"><span className="risk-pill" style={{ background: CP_STATUS_META[p.status].bg, color: CP_STATUS_META[p.status].fg }}>{CP_STATUS_META[p.status].label}</span></td>
                <td className="py-1.5" style={{ color: "var(--text-600)" }}>{p.progress}%</td>
                <td className="py-1.5" style={{ color: "var(--text-600)" }}>{fdate(p.plannedEnd)}</td>
                <td className="py-1.5" style={{ color: "var(--text-600)" }}>{money(p.budgetActual)} / {money(p.budgetPlanned)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>
      {project.notes && (
        <Panel className="mb-6">
          <PanelHeader title="Notas y observaciones" />
          <p className="text-sm" style={{ color: "var(--text-900)" }}>{project.notes}</p>
        </Panel>
      )}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <Panel>
          <PanelHeader title="Riesgos críticos" />
          {criticalRisks.length ? (
            <ul className="space-y-2 text-sm" style={{ color: "var(--text-900)" }}>
              {criticalRisks.map((r) => <li key={r.id}>· {r.description}</li>)}
            </ul>
          ) : <p className="text-sm" style={{ color: "var(--text-400)" }}>Ninguno registrado.</p>}
        </Panel>
        <Panel>
          <PanelHeader title="Próximos hitos" />
          {upcoming.length ? (
            <ul className="space-y-2 text-sm" style={{ color: "var(--text-900)" }}>
              {upcoming.map((m) => <li key={m.id}>· {m.name.replace(/^Fin de /, "")} — {fdate(m.date)}</li>)}
            </ul>
          ) : <p className="text-sm" style={{ color: "var(--text-400)" }}>Sin hitos pendientes.</p>}
        </Panel>
      </div>
      <Panel className="mb-6">
        <PanelHeader title="Recomendaciones" />
        <ul className="space-y-2 text-sm" style={{ color: "var(--text-900)" }}>
          {recs.map((r, i) => <li key={i}>· {r}</li>)}
        </ul>
      </Panel>
      <Panel>
        <PanelHeader title="Puntos a analizar" />
        <ul className="space-y-2 text-sm" style={{ color: "var(--text-900)" }}>
          {points.map((r, i) => <li key={i}>· {r}</li>)}
        </ul>
      </Panel>
    </div>
  );
}

/* ---------------------------------- reporteria (exportar a excel) ---------------------------------- */

function CP_exportProjectExcel(project, rag, milestones, points, recs) {
  const wb = XLSX.utils.book_new();

  const resumen = [{
    "Proyecto": project.name,
    "Cliente": project.client,
    "Tipo": project.type || "",
    "Responsable": project.manager || "",
    "Fecha de inicio": project.startDate ? fdate(project.startDate) : "",
    "Estado general": rag.level === "rojo" ? "Crítico" : rag.level === "amarillo" ? "Atención" : "En control",
    "Avance físico (%)": rag.avanceFisico,
    "Ejecución presupuestaria (%)": rag.avancePresupuestario,
    "Presupuesto planificado (USD)": rag.planned,
    "Presupuesto ejecutado (USD)": rag.actual,
    "Fecha del informe": fdate(todayISO()),
    "Notas": project.notes || "",
  }];
  const wsResumen = XLSX.utils.json_to_sheet(resumen);
  wsResumen["!cols"] = [{ wch: 30 }, { wch: 26 }, { wch: 26 }, { wch: 20 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 16 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

  const fases = project.phases.map((p) => ({
    "Fase": p.name,
    "Responsable": p.responsible || "",
    "Estado": CP_STATUS_META[p.status].label,
    "Avance (%)": p.progress,
    "Peso (%)": p.weight,
    "Inicio planificado": fdate(p.plannedStart),
    "Fin planificado": fdate(p.plannedEnd),
    "Fin real": p.actualEnd ? fdate(p.actualEnd) : "",
    "Presupuesto planificado (USD)": p.budgetPlanned,
    "Presupuesto ejecutado (USD)": p.budgetActual,
  }));
  const wsFases = XLSX.utils.json_to_sheet(fases);
  wsFases["!cols"] = [{ wch: 28 }, { wch: 20 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 22 }];
  XLSX.utils.book_append_sheet(wb, wsFases, "Fases");

  const riesgos = (project.risks || []).map((r) => ({
    "Descripción": r.description,
    "Probabilidad": r.prob === 3 ? "Alta" : r.prob === 2 ? "Media" : "Baja",
    "Impacto": r.impact === 3 ? "Alto" : r.impact === 2 ? "Medio" : "Bajo",
    "Nivel": riskLevel(r.prob, r.impact),
    "Estado": r.status === "abierto" ? "Abierto" : "Mitigado",
    "Responsable": r.owner || "",
    "Mitigación": r.mitigation || "",
  }));
  const wsRiesgos = XLSX.utils.json_to_sheet(riesgos.length ? riesgos : [{ "Descripción": "Sin riesgos registrados" }]);
  wsRiesgos["!cols"] = [{ wch: 40 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 18 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, wsRiesgos, "Riesgos");

  const hitos = milestones.map((m) => ({
    "Hito": m.name.replace(/^Fin de /, ""),
    "Fecha": fdate(m.date),
    "Responsable": m.responsible || "",
    "Estado": m.done ? "Cumplido" : (new Date(m.date + "T00:00:00") < new Date(new Date().toDateString()) ? "Vencido" : "Pendiente"),
  }));
  const wsHitos = XLSX.utils.json_to_sheet(hitos.length ? hitos : [{ "Hito": "Sin hitos registrados" }]);
  wsHitos["!cols"] = [{ wch: 34 }, { wch: 14 }, { wch: 20 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsHitos, "Hitos");

  const analisis = [].concat(
    recs.map((r) => ({ "Tipo": "Recomendación", "Detalle": r })),
    points.map((r) => ({ "Tipo": "Punto a analizar", "Detalle": r }))
  );
  const wsAnalisis = XLSX.utils.json_to_sheet(analisis);
  wsAnalisis["!cols"] = [{ wch: 18 }, { wch: 95 }];
  XLSX.utils.book_append_sheet(wb, wsAnalisis, "Análisis");

  const safeName = project.name.replace(/[\\/:*?"<>|]/g, "-").slice(0, 60);
  XLSX.writeFile(wb, "Informe - " + safeName + " - " + todayISO() + ".xlsx");
}

/* ---------------------------------- app principal ---------------------------------- */

function CP_Module({ projects, updateProject, createProject, deleteProject, focusId }) {
  const [selectedId, setSelectedId] = useState(focusId || (projects[0] ? projects[0].id : null));
  const [pYear, setPYear] = useState("todos");
  const [pEstado, setPEstado] = useState("todos");
  const [view, setView] = useState("detail");
  const [tab, setTab] = useState("resumen");
  const [expandedPhaseId, setExpandedPhaseId] = useState(null);
  useEffect(() => { if (focusId) { setSelectedId(focusId); setView("detail"); setTab("resumen"); } }, [focusId]);

  useEffect(() => {
    if ((!selectedId || !projects.some((p) => p.id === selectedId)) && projects[0]) setSelectedId(projects[0].id);
  }, [projects, selectedId]);

  const project = projects.find((p) => p.id === selectedId) || null;

  const updatePhase = useCallback((phaseId, patch) => {
    if (!project) return;
    updateProject(project.id, { phases: project.phases.map((ph) => (ph.id === phaseId ? { ...ph, ...patch } : ph)) });
  }, [project, updateProject]);
  const toggleDeliverable = useCallback((phaseId, delivId) => {
    if (!project) return;
    updateProject(project.id, { phases: project.phases.map((ph) => ph.id !== phaseId ? ph : { ...ph, deliverables: ph.deliverables.map((d) => d.id === delivId ? { ...d, done: !d.done } : d) }) });
  }, [project, updateProject]);
  const addRisk = useCallback((form) => {
    if (!project) return;
    updateProject(project.id, { risks: [...(project.risks || []), { id: uid(), status: "abierto", ...form }] });
  }, [project, updateProject]);
  const deleteRisk = useCallback((riskId) => {
    if (!project) return;
    updateProject(project.id, { risks: (project.risks || []).filter((r) => r.id !== riskId) });
  }, [project, updateProject]);
  const toggleRiskStatus = useCallback((riskId) => {
    if (!project) return;
    updateProject(project.id, { risks: (project.risks || []).map((r) => r.id === riskId ? { ...r, status: r.status === "abierto" ? "mitigado" : "abierto" } : r) });
  }, [project, updateProject]);
  const addMilestone = useCallback((form) => {
    if (!project) return;
    updateProject(project.id, { milestones: [...(project.milestones || []), { id: uid(), done: false, ...form }] });
  }, [project, updateProject]);
  const deleteMilestone = useCallback((mid) => {
    if (!project) return;
    updateProject(project.id, { milestones: (project.milestones || []).filter((m) => m.id !== mid) });
  }, [project, updateProject]);

  const handleCreate = (form) => {
    const id = createProject(form);
    setSelectedId(id);
    setView("detail");
    setTab("resumen");
  };
  const handleDelete = (id) => {
    deleteProject(id);
    if (selectedId === id) {
      const rest = projects.filter((p) => p.id !== id);
      setSelectedId(rest.length ? rest[0].id : null);
    }
  };

  const rag = project ? CP_computeRag(project) : null;
  const milestones = project ? CP_buildMilestones(project) : [];

  return (
    <div className="space-y-6">
      <div className="flex items-center gap-3 flex-wrap text-xs">
        <span style={{ color: "var(--text-400)" }}>Filtrar proyectos:</span>
        <select className="field" style={{ width: "auto" }} value={pYear} onChange={(e) => setPYear(e.target.value)}>
          <option value="todos">Todos los años</option>
          {[...new Set(projects.map((p) => (CP_projectDates(p).start || "").slice(0, 4)).filter(Boolean))].sort().reverse().map((y) => <option key={y} value={y}>Iniciados en {y}</option>)}
        </select>
        <select className="field" style={{ width: "auto" }} value={pEstado} onChange={(e) => setPEstado(e.target.value)}>
          <option value="todos">Todos los estados</option>
          <option value="activos">En ejecución</option>
          <option value="terminados">Terminados</option>
        </select>
      </div>
      <ModulePicker items={projects.filter((p) => p.id === selectedId || ((pYear === "todos" || (CP_projectDates(p).start || "").slice(0, 4) === pYear) && (pEstado === "todos" || (pEstado === "terminados") === (CP_projectState(p) === "culminado")))).map((p) => ({ id: p.id, name: p.name, sub: p.client, done: CP_isProjectComplete(p) || !!p.ctrlEnd }))} selectedId={selectedId}
        onSelect={(id) => { setSelectedId(id); setView("detail"); setTab("resumen"); setExpandedPhaseId(null); }}
        onNew={() => setView("new")} onDelete={handleDelete} newLabel="Nuevo proyecto" />

      {view === "new" || !project ? (
        <CP_NewProjectForm onCreate={handleCreate} onCancel={() => project && setView("detail")} />
      ) : (
        <div className="space-y-6">
          <CP_ProjectHeader project={project} rag={rag} tab={tab} setTab={setTab} onUpdateMeta={(patch) => updateProject(project.id, patch)} />
          {tab === "resumen" ? (
            <Fragment>
              <CP_KpiRow rag={rag} milestones={milestones} />
              <Panel>
                <PanelHeader title="Proceso del proyecto" />
                <CP_PhaseFlow phases={project.phases} expandedId={expandedPhaseId} setExpandedId={setExpandedPhaseId} onUpdatePhase={updatePhase} onToggleDeliverable={toggleDeliverable} />
              </Panel>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Panel><PanelHeader title="Curva S — avance planificado vs. real" /><CP_SCurveChart phases={project.phases} /></Panel>
                <Panel><PanelHeader title="Presupuesto por fase" /><CP_BudgetChart phases={project.phases} /></Panel>
              </div>
              <Panel>
                <PanelHeader title="Riesgos" />
                <RiskSection risks={project.risks || []} onAdd={addRisk} onDelete={deleteRisk} onToggleStatus={toggleRiskStatus} />
              </Panel>
              <Panel>
                <PanelHeader title="Hitos" />
                <CP_MilestonesTimeline milestones={milestones} onAdd={addMilestone} onDelete={deleteMilestone} />
              </Panel>
            </Fragment>
          ) : tab === "informe" ? (
            <CP_ExecutiveReport project={project} rag={rag} milestones={milestones} />
          ) : (
            <CP_ReportingSection project={project} rag={rag} milestones={milestones} projects={projects} />
          )}
        </div>
      )}
    </div>
  );
}

/* ===== MODULO: CALENDARIO ===== */









const CAL_PALETTE = ["#2F7D5B", "#E8A33D", "#3B6E91", "#8B5FBF", "#C1443D", "#4C5C6E", "#1F8A8A", "#B9791F", "#5B7DB1", "#8A5A2F"];

const CAL_ITEM_STATUS_META = {
  planificado: { label: "Planificado", fg: "var(--text-600)", bg: "var(--steel-100)" },
  en_curso: { label: "En curso", fg: COLORS.amberDark, bg: "var(--amber-soft)" },
  completado: { label: "Completado", fg: COLORS.green, bg: "var(--green-soft)" },
};

function CAL_endDateOf(item) {
  return addDays(new Date(item.startDate + "T00:00:00"), Math.max(1, Number(item.durationDays) || 1) - 1);
}

function CAL_detectCrossings(items) {
  const crossings = [];
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      const ra = (a.resource || "").trim().toLowerCase();
      const rb = (b.resource || "").trim().toLowerCase();
      if (!ra || !rb || ra !== rb) continue;
      const aStart = new Date(a.startDate + "T00:00:00"), aEnd = CAL_endDateOf(a);
      const bStart = new Date(b.startDate + "T00:00:00"), bEnd = CAL_endDateOf(b);
      const start = aStart > bStart ? aStart : bStart;
      const end = aEnd < bEnd ? aEnd : bEnd;
      if (start <= end) {
        crossings.push({ id: a.id + "_" + b.id, a, b, resource: a.resource, start: toISO(start), end: toISO(end), days: daysBetween(start, end) + 1 });
      }
    }
  }
  return crossings;
}

function CAL_computeWeeklyLoad(items) {
  if (!items.length) return [];
  const starts = items.map((it) => new Date(it.startDate + "T00:00:00"));
  const ends = items.map((it) => CAL_endDateOf(it));
  let cursor = new Date(Math.min.apply(null, starts));
  const day = cursor.getDay();
  cursor = addDays(cursor, day === 0 ? -6 : 1 - day);
  const rangeEnd = new Date(Math.max.apply(null, ends));
  const weeks = [];
  let guard = 0;
  while (cursor <= rangeEnd && guard < 104) {
    const weekEnd = addDays(cursor, 6);
    const count = items.filter((it) => {
      const s = new Date(it.startDate + "T00:00:00");
      const e = CAL_endDateOf(it);
      return s <= weekEnd && e >= cursor;
    }).length;
    weeks.push({
      start: toISO(cursor),
      label: fdate(toISO(cursor)),
      shortLabel: cursor.toLocaleDateString("es-EC", { day: "2-digit", month: "short" }),
      count,
    });
    cursor = addDays(cursor, 7);
    guard++;
  }
  return weeks;
}

function CAL_scheduleRecommendations(items, crossings, weeks) {
  const out = [];
  if (crossings.length > 0) {
    out.push(`Se detectaron ${crossings.length} cruce(s) de recursos. Evaluar escalonar fechas de inicio o reforzar temporalmente el recurso compartido para evitar cuellos de botella.`);
  }
  const peakWeek = weeks.reduce((max, w) => (w.count > (max ? max.count : -1) ? w : max), null);
  if (peakWeek && peakWeek.count >= 4) {
    out.push(`La semana del ${peakWeek.label} concentra ${peakWeek.count} proyectos activos simultáneamente — es el punto de mayor carga del cronograma actual. Confirmar disponibilidad de personal y equipos para esas fechas.`);
  }
  const noResource = items.filter((it) => !it.resource);
  if (noResource.length > 0) {
    out.push(`${noResource.length} proyecto(s) no tienen un recurso/equipo asignado, por lo que no se pueden validar cruces para ellos. Completar ese dato mejora la detección de conflictos.`);
  }
  if (out.length === 0) {
    out.push("No se identifican conflictos de cronograma por el momento. Mantener actualizada la duración de cada proyecto para conservar esta vista al día.");
  }
  return out;
}

/* ---------------------------------- gantt y cargas ---------------------------------- */

function CAL_GanttChart({ items, crossings }) {
  const today = todayISO();
  const rowH = 34;
  const headerH = 26;
  const pxPerDay = 24;
  const leftW = 190;

  const { rangeStartISO, totalDays } = useMemo(() => {
    if (!items.length) return { rangeStartISO: todayISO(), totalDays: 30 };
    const starts = items.map((it) => new Date(it.startDate + "T00:00:00"));
    const ends = items.map((it) => CAL_endDateOf(it));
    const rs = addDays(new Date(Math.min.apply(null, starts)), -3);
    const re = addDays(new Date(Math.max.apply(null, ends)), 3);
    return { rangeStartISO: toISO(rs), totalDays: Math.max(14, daysBetween(rs, re) + 1) };
  }, [items]);

  const rangeStart = new Date(rangeStartISO + "T00:00:00");
  const xAt = (iso) => daysBetween(rangeStart, new Date(iso + "T00:00:00")) * pxPerDay;
  const chartW = totalDays * pxPerDay;
  const chartH = headerH + Math.max(1, items.length) * rowH;

  const months = [];
  {
    let cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
    const rangeEnd = addDays(rangeStart, totalDays - 1);
    let guard = 0;
    while (cursor <= rangeEnd && guard < 36) {
      months.push(new Date(cursor));
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      guard++;
    }
  }

  const dayCols = useMemo(() => {
    const arr = [];
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(rangeStart, i);
      const dow = d.getDay();
      arr.push({ x: i * pxPerDay, isMonday: dow === 1, isWeekend: dow === 0 || dow === 6 });
    }
    return arr;
  }, [rangeStartISO, totalDays]);

  return (
    <div className="flex" style={{ overflow: "hidden" }}>
      <div style={{ width: leftW, flexShrink: 0 }}>
        <div style={{ height: headerH }} />
        {items.map((it) => {
          const done = it.status === "completado";
          return (
            <div key={it.id} className="flex items-center gap-2 pr-2" style={{ height: rowH, borderTop: "1px solid var(--steel-100)" }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: done ? COLORS.green : it.color, flexShrink: 0 }} />
              <div className="min-w-0">
                <p className="text-xs font-medium truncate" style={{ color: done ? COLORS.green : "var(--text-900)" }}>{it.name}</p>
                {it.resource && <p className="text-[10px] truncate" style={{ color: "var(--text-400)" }}>{it.resource}</p>}
              </div>
            </div>
          );
        })}
        {items.length === 0 && <p className="text-xs" style={{ color: "var(--text-400)" }}>Sin proyectos</p>}
      </div>
      <div style={{ overflowX: "auto", flex: 1 }}>
        <svg width={chartW} height={chartH} viewBox={"0 0 " + chartW + " " + chartH}>
          {/* sombreado de fines de semana, para ubicar los días de un vistazo */}
          {dayCols.map((d, i) => d.isWeekend && (
            <rect key={"we-" + i} x={d.x} y={headerH} width={pxPerDay} height={chartH - headerH} fill="var(--steel-100)" opacity="0.6" />
          ))}
          {/* líneas horizontales por fila, para seguir cada barra desde su nombre */}
          {items.map((it, i) => (
            <line key={"row-" + it.id} x1={0} x2={chartW} y1={headerH + (i + 1) * rowH} y2={headerH + (i + 1) * rowH} stroke="var(--steel-100)" />
          ))}
          {/* líneas verticales por día (más marcada al inicio de cada semana) */}
          {dayCols.map((d, i) => (
            <line key={"day-" + i} x1={d.x} x2={d.x} y1={0} y2={chartH} stroke={d.isMonday ? "var(--steel-300)" : "var(--steel-100)"} strokeWidth={d.isMonday ? 1 : 0.75} opacity={d.isMonday ? 0.9 : 0.55} />
          ))}
          {months.map((m, i) => {
            const x = xAt(toISO(m));
            return (
              <g key={i}>
                <line x1={x} x2={x} y1={0} y2={chartH} stroke="var(--steel-300)" strokeWidth="1.5" />
                <text x={x + 4} y={16} fontSize="10" fontWeight="600" fill="var(--text-600)">{m.toLocaleDateString("es-EC", { month: "short", year: "2-digit" })}</text>
              </g>
            );
          })}
          {crossings.map((c) => {
            const x = xAt(c.start);
            const w = Math.max(pxPerDay, (daysBetween(new Date(c.start + "T00:00:00"), new Date(c.end + "T00:00:00")) + 1) * pxPerDay);
            return <rect key={c.id} x={x} y={headerH} width={w} height={chartH - headerH} fill={COLORS.red} opacity="0.14" />;
          })}
          {xAt(today) >= 0 && xAt(today) <= chartW && (
            <line x1={xAt(today)} x2={xAt(today)} y1={0} y2={chartH} stroke={COLORS.ink} strokeWidth="1.5" strokeDasharray="3 3" />
          )}
          {items.map((it, i) => {
            const x = xAt(it.startDate);
            const w = Math.max(pxPerDay * 0.6, Number(it.durationDays || 1) * pxPerDay - 3);
            const y = headerH + i * rowH + 6;
            const done = it.status === "completado";
            const late = !done && CAL_endDateOf(it) < new Date(new Date().toDateString());
            return (
              <g key={it.id}>
                <rect x={x} y={y} width={w} height={rowH - 12} rx="4" fill={done ? COLORS.green : it.color} opacity={it.status === "planificado" ? 0.55 : 1} stroke={late ? COLORS.red : "none"} strokeWidth={late ? 2 : 0} />
                {done && <text x={x + 5} y={y + (rowH - 12) / 2 + 3} fontSize="9" fill="#fff">✓</text>}
                <title>{it.name + ": " + fdate(it.startDate) + " – " + fdate(toISO(CAL_endDateOf(it))) + " (" + it.durationDays + " días)" + (done ? " — Completado" : "") + (it.notes ? " — " + it.notes : "")}</title>
              </g>
            );
          })}
        </svg>
      </div>
    </div>
  );
}

/* ---------------------------------- vistas de calendario (mes / semana / año) ---------------------------------- */

function CAL_startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  return addDays(d, day === 0 ? -6 : 1 - day);
}
function CAL_loadColorFor(count) {
  return count >= 4 ? COLORS.red : count === 3 ? COLORS.amber : count > 0 ? COLORS.steel : "var(--steel-100)";
}
function CAL_itemsActiveOn(items, day) {
  return items.filter((it) => {
    const s = new Date(it.startDate + "T00:00:00");
    const e = CAL_endDateOf(it);
    return day >= s && day <= e;
  });
}

function CAL_CalendarNav({ label, onPrev, onNext, onToday }) {
  return (
    <div className="flex items-center justify-between mb-3">
      <button onClick={onPrev} className="btn-ghost px-2 py-1 text-xs">‹</button>
      <p className="text-sm font-semibold capitalize" style={{ color: "var(--text-900)" }}>{label}</p>
      <div className="flex gap-1">
        <button onClick={onToday} className="btn-ghost px-2 py-1 text-xs">Hoy</button>
        <button onClick={onNext} className="btn-ghost px-2 py-1 text-xs">›</button>
      </div>
    </div>
  );
}

        label={label}

function CAL_WeeklyLoadChart({ weeks }) {
  if (!weeks.length) return <p className="text-sm" style={{ color: "var(--text-400)" }}>Agrega proyectos para ver la carga semanal.</p>;
  const barW = 26, gap = 12, padL = 30, padT = 14, padB = 28, padR = 10;
  const chartH = 180;
  const maxCount = Math.max(3, Math.max.apply(null, weeks.map((w) => w.count)));
  const chartW = weeks.length * (barW + gap) + padL + padR;
  const usableH = chartH - padT - padB;
  const yAt = (v) => padT + usableH - (v / maxCount) * usableH;
  const colorFor = (c) => (c >= 4 ? COLORS.red : c === 3 ? COLORS.amber : c > 0 ? COLORS.steel : "var(--steel-100)");
  const tickCount = Math.min(4, maxCount);
  const ticks = Array.from({ length: tickCount + 1 }, (_, i) => Math.round((maxCount / tickCount) * i));
  return (
    <div style={{ overflowX: "auto" }}>
      <svg width={chartW} height={chartH} viewBox={"0 0 " + chartW + " " + chartH}>
        {ticks.map((t) => (
          <g key={t}>
            <line x1={padL} x2={chartW - padR} y1={yAt(t)} y2={yAt(t)} stroke="var(--steel-100)" />
            <text x={padL - 6} y={yAt(t) + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{t}</text>
          </g>
        ))}
        {weeks.map((w, i) => {
          const x = padL + i * (barW + gap);
          const h = (w.count / maxCount) * usableH;
          const y = padT + usableH - h;
          return (
            <g key={w.start}>
              <rect x={x} y={y} width={barW} height={Math.max(0, h)} fill={colorFor(w.count)} rx="3" />
              <title>{"Semana del " + w.label + ": " + w.count + " proyecto(s) activos"}</title>
              <text x={x + barW / 2} y={chartH - padB + 12} textAnchor="middle" fontSize="8.5" fill="var(--text-400)">{w.shortLabel}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function CAL_exportScheduleExcel(items, crossings, risks, weeks) {
  const wb = XLSX.utils.book_new();

  const cronograma = items.map((it) => ({
    "Proyecto": it.name, "Cliente": it.client, "Recurso / equipo": it.resource || "",
    "Inicio": fdate(it.startDate), "Duración (días)": it.durationDays, "Fin": fdate(toISO(CAL_endDateOf(it))),
    "Estado": CAL_ITEM_STATUS_META[it.status].label, "Notas": it.notes || "",
  }));
  const ws1 = XLSX.utils.json_to_sheet(cronograma.length ? cronograma : [{ "Proyecto": "Sin proyectos registrados" }]);
  ws1["!cols"] = [{ wch: 30 }, { wch: 24 }, { wch: 22 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws1, "Cronograma");

  const cruces = crossings.map((c) => ({
    "Proyecto A": c.a.name, "Proyecto B": c.b.name, "Recurso compartido": c.resource,
    "Desde": fdate(c.start), "Hasta": fdate(c.end), "Días de traslape": c.days,
  }));
  const ws2 = XLSX.utils.json_to_sheet(cruces.length ? cruces : [{ "Proyecto A": "Sin cruces detectados" }]);
  ws2["!cols"] = [{ wch: 26 }, { wch: 26 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Cruces");

  const riesgosRows = (risks || []).map((r) => ({
    "Descripción": r.description,
    "Probabilidad": r.prob === 3 ? "Alta" : r.prob === 2 ? "Media" : "Baja",
    "Impacto": r.impact === 3 ? "Alto" : r.impact === 2 ? "Medio" : "Bajo",
    "Nivel": riskLevel(r.prob, r.impact),
    "Estado": r.status === "abierto" ? "Abierto" : "Mitigado",
    "Responsable": r.owner || "", "Mitigación": r.mitigation || "",
  }));
  const ws3 = XLSX.utils.json_to_sheet(riesgosRows.length ? riesgosRows : [{ "Descripción": "Sin riesgos registrados" }]);
  ws3["!cols"] = [{ wch: 40 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 18 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws3, "Riesgos");

  const cargaRows = weeks.map((w) => ({ "Semana del": w.label, "Proyectos activos": w.count }));
  const ws4 = XLSX.utils.json_to_sheet(cargaRows.length ? cargaRows : [{ "Semana del": "Sin datos" }]);
  ws4["!cols"] = [{ wch: 16 }, { wch: 18 }];
  XLSX.utils.book_append_sheet(wb, ws4, "Carga semanal");

  XLSX.writeFile(wb, "Cronograma de proyectos - " + todayISO() + ".xlsx");
}

function MAT_fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve(result.split(",")[1] || "");
    };
    reader.onerror = () => reject(new Error("read_failed"));
    reader.readAsDataURL(file);
  });
}

async function MAT_uploadFileToServer(file) {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.url) { const err = new Error("not_configured"); err.code = "not_configured"; throw err; }
  const base64Data = await MAT_fileToBase64(file);
  let res;
  try {
    res = await fetch(cfg.url, {
      method: "POST",
      body: JSON.stringify({ token: cfg.token || "", action: "uploadFile", filename: file.name, mimeType: file.type || "application/pdf", base64Data }),
    });
  } catch (networkErr) { const err = new Error("network_error"); err.code = "network_error"; throw err; }
  let data;
  try { data = await res.json(); } catch (e) { const err = new Error("bad_response"); err.code = "bad_response"; throw err; }
  if (data.error) { const err = new Error(data.detail || data.error); err.code = data.error; throw err; }
  return data;
}

/* ---------------------------------- estadisticas ---------------------------------- */

function MAT_planosStats(project) {
  const planos = project.planos || [];
  const total = planos.length;
  const aprobados = planos.filter((p) => p.status === "aprobado").length;
  const pct = total ? Math.round((aprobados / total) * 100) : 0;
  return { total, aprobados, pct, completo: total > 0 && aprobados === total };
}
function MAT_materialesStats(project) {
  const mats = project.materials || [];
  const total = mats.length;
  const recibidos = mats.filter((m) => m.received).length;
  const pct = total ? Math.round((recibidos / total) * 100) : 0;
  return { total, recibidos, pct, completo: total > 0 && recibidos === total };
}

function MAT_planningRecommendations(projects, visits) {
  const out = [];
  const today = todayISO();
  projects.forEach((p) => {
    const ps = MAT_planosStats(p), ms = MAT_materialesStats(p);
    if (p.planosDueDate && p.planosDueDate < today && !ps.completo) {
      out.push(`"${p.name}": la entrega de planos venció el ${fdate(p.planosDueDate)} y aún no todos están aprobados (${ps.aprobados}/${ps.total}).`);
    } else if (p.planosDueDate && !ps.completo) {
      const days = daysBetween(today, p.planosDueDate);
      if (days >= 0 && days <= 5) out.push(`"${p.name}": quedan ${days} día(s) para la entrega de planos y aún no están todos aprobados.`);
    }
    if (p.materialesDueDate && p.materialesDueDate < today && !ms.completo) {
      out.push(`"${p.name}": la entrega de materiales venció el ${fdate(p.materialesDueDate)} y el listado está al ${ms.pct}% (${ms.recibidos}/${ms.total}).`);
    } else if (p.materialesDueDate && !ms.completo) {
      const days = daysBetween(today, p.materialesDueDate);
      if (days >= 0 && days <= 5) out.push(`"${p.name}": quedan ${days} día(s) para la entrega de materiales con solo ${ms.pct}% recibido.`);
    }
  });
  const upcomingVisits = visits.filter((v) => v.status !== "cancelada" && v.date >= today).sort((a, b) => (a.date + a.time < b.date + b.time ? -1 : 1)).slice(0, 3);
  if (upcomingVisits.length) {
    out.push("Próximas visitas técnicas: " + upcomingVisits.map((v) => v.company + " (" + fdate(v.date) + ")").join(", ") + ".");
  }
  if (out.length === 0) out.push("No se identifican vencimientos ni riesgos inmediatos en planos, materiales o visitas programadas.");
  return out;
}

function MAT_PlanosPanel({ project, onUpdate }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const planos = project.planos || [];
  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (file.type !== "application/pdf") { setError("Solo se aceptan archivos PDF."); return; }
    if (file.size > 15 * 1024 * 1024) { setError("El archivo supera los 15 MB permitidos."); return; }
    setError(""); setUploading(true);
    try {
      const res = await MAT_uploadFileToServer(file);
      const nuevo = { id: uid(), filename: file.name, url: res.url, fileId: res.fileId, uploadedAt: todayISO(), status: "borrador" };
      onUpdate({ planos: [...planos, nuevo] });
    } catch (err) {
      setError(err.code === "not_configured" ? "Primero conecta la app con Google Sheets desde Configuración." : "No se pudo subir el archivo: " + (err.message || "revisa tu conexión e inténtalo de nuevo."));
    } finally {
      setUploading(false);
    }
  };
  const updatePlano = (id, patch) => onUpdate({ planos: planos.map((p) => (p.id === id ? { ...p, ...patch } : p)) });
  const deletePlano = (id) => onUpdate({ planos: planos.filter((p) => p.id !== id) });
  return (
    <div>
      <div className="space-y-2 mb-3">
        {planos.map((p) => (
          <div key={p.id} className="flex items-center gap-2 text-sm p-2 rounded flex-wrap" style={{ background: "var(--paper)", border: "1px solid var(--steel-200)" }}>
            <FileIcon size={16} color="var(--text-400)" />
            <a href={p.url} target="_blank" rel="noopener noreferrer" className="truncate flex-1" style={{ color: "var(--text-900)", textDecoration: "underline", minWidth: 100 }}>{p.filename}</a>
            <span className="text-xs" style={{ color: "var(--text-400)" }}>{fdate(p.uploadedAt)}</span>
            <select className="field" style={{ width: 110 }} value={p.status} onChange={(e) => updatePlano(p.id, { status: e.target.value })}>
              <option value="borrador">Borrador</option>
              <option value="aprobado">Aprobado</option>
            </select>
            <button aria-label="Eliminar" onClick={() => deletePlano(p.id)} style={{ color: "var(--text-400)" }}><Trash2 size={13} /></button>
          </div>
        ))}
        {planos.length === 0 && <p className="text-sm" style={{ color: "var(--text-400)" }}>Aún no se ha subido ningún plano.</p>}
      </div>
      {error && <p className="text-xs mb-2" style={{ color: COLORS.red }}>{error}</p>}
      <label className="btn-ghost text-xs cursor-pointer" style={{ display: "inline-block" }}>
        {uploading ? "Subiendo…" : <Fragment><Plus size={12} className="inline -mt-0.5 mr-1" />Subir plano (PDF)</Fragment>}
        <input type="file" accept="application/pdf" onChange={onFile} style={{ display: "none" }} disabled={uploading} />
      </label>
    </div>
  );
}

function MAT_CompletionChart({ projects }) {
  const data = projects.map((p) => ({ name: p.name.length > 14 ? p.name.slice(0, 13) + "…" : p.name, planos: MAT_planosStats(p).pct, materiales: MAT_materialesStats(p).pct }));
  const n = Math.max(1, data.length);
  const W = Math.max(340, n * 90), H = 230, padL = 34, padR = 14, padT = 14, padB = 40;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const slot = chartW / n;
  const barW = slot * 0.28, gap = slot * 0.08;
  const x0 = (i) => padL + i * slot + (slot - (barW * 2 + gap)) / 2;
  const hAt = (v) => (v / 100) * chartH;
  return (
    <svg width={W} height={H} viewBox={"0 0 " + W + " " + H} style={{ maxWidth: "100%" }}>
      {[0, 50, 100].map((t) => {
        const y = padT + chartH - (t / 100) * chartH;
        return <g key={t}><line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--steel-100)" /><text x={padL - 6} y={y + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{t}%</text></g>;
      })}
      {data.map((d, i) => (
        <g key={i}>
          <rect x={x0(i)} y={padT + chartH - hAt(d.planos)} width={barW} height={hAt(d.planos)} fill={COLORS.steel} rx="2">
            <title>{d.name + " · Planos: " + d.planos + "%"}</title>
          </rect>
          <rect x={x0(i) + barW + gap} y={padT + chartH - hAt(d.materiales)} width={barW} height={hAt(d.materiales)} fill={COLORS.amber} rx="2">
            <title>{d.name + " · Materiales: " + d.materiales + "%"}</title>
          </rect>
          <text x={padL + i * slot + slot / 2} y={H - padB + 14} textAnchor="middle" fontSize="9" fill="var(--text-400)">{d.name}</text>
        </g>
      ))}
      <rect x={W - 150} y="4" width="9" height="9" fill={COLORS.steel} /><text x={W - 137} y="12" fontSize="9" fill="var(--text-600)">Planos</text>
      <rect x={W - 80} y="4" width="9" height="9" fill={COLORS.amber} /><text x={W - 67} y="12" fontSize="9" fill="var(--text-600)">Materiales</text>
    </svg>
  );
}

function MAT_exportDocsExcel(projects, visits) {
  const wb = XLSX.utils.book_new();

  const resumen = projects.map((p) => {
    const ps = MAT_planosStats(p), ms = MAT_materialesStats(p);
    return {
      "Proyecto": p.name, "Cliente": p.client, "Responsable": p.manager || "",
      "Inicio": p.startDate ? fdate(p.startDate) : "", "Fin": p.endDate ? fdate(p.endDate) : "",
      "Entrega planos": p.planosDueDate ? fdate(p.planosDueDate) : "", "Planos aprobados": ps.aprobados + "/" + ps.total,
      "Entrega materiales": p.materialesDueDate ? fdate(p.materialesDueDate) : "", "Materiales recibidos": ms.recibidos + "/" + ms.total,
      "Notas": p.notes || "",
    };
  });
  const ws1 = XLSX.utils.json_to_sheet(resumen.length ? resumen : [{ "Proyecto": "Sin proyectos registrados" }]);
  ws1["!cols"] = [{ wch: 28 }, { wch: 22 }, { wch: 18 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 18 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws1, "Proyectos");

  const planosRows = [];
  projects.forEach((p) => (p.planos || []).forEach((pl) => planosRows.push({
    "Proyecto": p.name, "Archivo": pl.filename, "Estado": pl.status === "aprobado" ? "Aprobado" : "Borrador", "Subido": fdate(pl.uploadedAt), "Enlace": pl.url || "",
  })));
  const ws2 = XLSX.utils.json_to_sheet(planosRows.length ? planosRows : [{ "Proyecto": "Sin planos registrados" }]);
  ws2["!cols"] = [{ wch: 26 }, { wch: 30 }, { wch: 12 }, { wch: 14 }, { wch: 50 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Planos");

  const matRows = [];
  projects.forEach((p) => (p.materials || []).forEach((m) => matRows.push({
    "Proyecto": p.name, "Material": m.name, "Cantidad": m.quantity, "Unidad": m.unit || "", "Recibido": m.received ? "Sí" : "No",
  })));
  const ws3 = XLSX.utils.json_to_sheet(matRows.length ? matRows : [{ "Proyecto": "Sin materiales registrados" }]);
  ws3["!cols"] = [{ wch: 26 }, { wch: 28 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws3, "Materiales");

  const visitRows = visits.map((v) => {
    const proj = projects.find((p) => p.id === v.projectId);
    return { "Empresa": v.company, "Proyecto": proj ? proj.name : "", "Fecha": fdate(v.date), "Hora": v.time, "Responsable": v.responsible, "Estado": v.status, "Notas": v.notes || "" };
  });
  const ws4 = XLSX.utils.json_to_sheet(visitRows.length ? visitRows : [{ "Empresa": "Sin visitas registradas" }]);
  ws4["!cols"] = [{ wch: 24 }, { wch: 26 }, { wch: 14 }, { wch: 10 }, { wch: 18 }, { wch: 14 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws4, "Visitas");

  XLSX.writeFile(wb, "Planos y materiales - " + todayISO() + ".xlsx");
}

function MAT_Module({ projects, updateProject, createProject, deleteProject, visits, setVisits, cpProjects }) {
  const [selectedId, setSelectedId] = useState(projects[0] ? projects[0].id : null);
  const [tab, setTab] = useState("proyecto");
  const [view, setView] = useState("detail");

  useEffect(() => {
    if ((!selectedId || !projects.some((p) => p.id === selectedId)) && projects[0]) setSelectedId(projects[0].id);
  }, [projects, selectedId]);

  const project = projects.find((p) => p.id === selectedId) || null;

  const handleCreate = (form) => {
    const id = createProject(form);
    setSelectedId(id);
    setTab("proyecto");
    setView("detail");
  };
  const handleDelete = (id) => {
    deleteProject(id);
    setVisits((prev) => prev.filter((v) => v.projectId !== id));
    if (selectedId === id) {
      const rest = projects.filter((p) => p.id !== id);
      setSelectedId(rest.length ? rest[0].id : null);
    }
  };
  const updateSelected = useCallback((patch) => {
    if (!selectedId) return;
    updateProject(selectedId, patch);
  }, [selectedId, updateProject]);

  const addVisit = (form) => setVisits((prev) => [...prev, { id: uid(), status: "programada", ...form }]);
  const updateVisit = (id, patch) => setVisits((prev) => prev.map((v) => (v.id === id ? { ...v, ...patch } : v)));
  const deleteVisit = (id) => setVisits((prev) => prev.filter((v) => v.id !== id));

  return (
    <div className="space-y-6">
      <SubTabs tabs={[["proyecto", "Proyecto"], ["visitas", "Visitas técnicas"], ["reportes", "Reportería"]]} active={tab} onChange={(t) => { setTab(t); setView("detail"); }} />
      {tab === "proyecto" ? (
        <div className="space-y-6">
          <ModulePicker items={projects.map((p) => ({ id: p.id, name: p.name, sub: p.client }))} selectedId={selectedId}
            onSelect={(id) => { setSelectedId(id); setView("detail"); }} onNew={() => setView("new")} onDelete={handleDelete} newLabel="Nuevo proyecto" />
          {view === "new" ? (
            <MAT_NewProjectForm onCreate={handleCreate} onCancel={() => project && setView("detail")} cpProjects={cpProjects} />
          ) : project ? (
            <MAT_ProjectDetail project={project} onUpdate={updateSelected} visits={visits} />
          ) : (
            <div className="max-w-lg mx-auto py-16 text-center">
              <p className="text-sm" style={{ color: "var(--text-400)" }}>Crea tu primer proyecto para empezar a subir planos y materiales.</p>
            </div>
          )}
        </div>
      ) : tab === "visitas" ? (
        <MAT_VisitsTab projects={projects} visits={visits} onAdd={addVisit} onUpdate={updateVisit} onDelete={deleteVisit} />
      ) : (
        <MAT_ReportingTab projects={projects} visits={visits} />
      )}
    </div>
  );
}

/* ===== MODULO: ACTAS Y ORDENES ===== */








const ACT_DOC_TYPE_META = {
  acta: { label: "Acta de entrega", prefix: "ACT" },
  orden: { label: "Orden de trabajo", prefix: "OT" },
};

const ACT_STATUS_META = {
  borrador: { label: "Borrador", fg: "var(--text-600)", bg: "var(--steel-100)" },
  emitido: { label: "Emitido", fg: COLORS.amberDark, bg: "var(--amber-soft)" },
  firmado: { label: "Firmado", fg: COLORS.green, bg: "var(--green-soft)" },
};

function ACT_nextNumber(docs, docType) {
  const count = docs.filter((d) => d.docType === docType).length + 1;
  return ACT_DOC_TYPE_META[docType].prefix + "-" + String(count).padStart(4, "0");
}

function ACT_clientSummary(docs) {
  const map = {};
  docs.forEach((d) => {
    if (!d.client) return;
    if (!map[d.client]) map[d.client] = { client: d.client, total: 0, actas: 0, ordenes: 0, pendientes: 0, lastDate: "" };
    const s = map[d.client];
    s.total++;
    if (d.docType === "acta") s.actas++; else s.ordenes++;
    if (d.status !== "firmado") s.pendientes++;
    if (!s.lastDate || (d.date && d.date > s.lastDate)) s.lastDate = d.date;
  });
  return Object.values(map).sort((a, b) => b.total - a.total);
}

function ACT_docsRecommendations(docs) {
  const out = [];
  const today = todayISO();
  const stale = docs.filter((d) => d.status !== "firmado" && d.date && daysBetween(d.date, today) >= 15);
  if (stale.length) out.push(`${stale.length} documento(s) llevan 15 días o más sin firmarse. Conviene dar seguimiento con el cliente antes de que se acumulen más.`);
  const summary = ACT_clientSummary(docs);
  const topPending = summary.filter((s) => s.pendientes > 0).sort((a, b) => b.pendientes - a.pendientes)[0];
  if (topPending) out.push(`El cliente "${topPending.client}" concentra ${topPending.pendientes} documento(s) pendientes de firma — es el que más atención de cierre necesita ahora mismo.`);
  const soloOrdenes = summary.filter((s) => s.actas === 0 && s.ordenes > 0);
  if (soloOrdenes.length) out.push(`${soloOrdenes.length} cliente(s) tienen órdenes de trabajo emitidas pero ninguna acta de entrega registrada todavía — vale la pena confirmar si esos trabajos ya se cerraron formalmente.`);
  if (out.length === 0) out.push("No hay documentos con seguimiento pendiente por el momento.");
  return out;
}

function ACT_ClientBarChart({ summary }) {
  const n = Math.max(1, summary.length);
  const W = Math.max(340, n * 90), H = 230, padL = 34, padR = 14, padT = 14, padB = 46;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const max = Math.max(1, Math.max.apply(null, summary.map((s) => s.total).concat([1])));
  const slot = chartW / n;
  const barW = slot * 0.5;
  const x0 = (i) => padL + i * slot + (slot - barW) / 2;
  const hAt = (v) => (v / max) * chartH;
  return (
    <svg width={W} height={H} viewBox={"0 0 " + W + " " + H} style={{ maxWidth: "100%" }}>
      {[0, Math.ceil(max / 2), max].map((t, ti) => {
        const y = padT + chartH - (t / max) * chartH;
        return <g key={ti}><line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--steel-100)" /><text x={padL - 6} y={y + 3} textAnchor="end" fontSize="9" fill="var(--text-400)">{t}</text></g>;
      })}
      {summary.map((s, i) => {
        const hActas = hAt(s.actas), hOrdenes = hAt(s.ordenes);
        const label = s.client.length > 12 ? s.client.slice(0, 11) + "…" : s.client;
        return (
          <g key={s.client}>
            <rect x={x0(i)} y={padT + chartH - hOrdenes - hActas} width={barW} height={hActas} fill={COLORS.green} rx="2"><title>{s.client + " · Actas: " + s.actas}</title></rect>
            <rect x={x0(i)} y={padT + chartH - hOrdenes} width={barW} height={hOrdenes} fill={COLORS.steel} rx="2"><title>{s.client + " · Órdenes: " + s.ordenes}</title></rect>
            <text x={padL + i * slot + slot / 2} y={H - padB + 14} textAnchor="middle" fontSize="9" fill="var(--text-400)">{label}</text>
          </g>
        );
      })}
      <rect x={W - 150} y="4" width="9" height="9" fill={COLORS.green} /><text x={W - 137} y="12" fontSize="9" fill="var(--text-600)">Actas</text>
      <rect x={W - 80} y="4" width="9" height="9" fill={COLORS.steel} /><text x={W - 67} y="12" fontSize="9" fill="var(--text-600)">Órdenes</text>
    </svg>
  );
}

function ACT_exportDocsListExcel(docs, summary) {
  const wb = XLSX.utils.book_new();
  const rows = docs.map((d) => ({
    "N.º": d.number, "Tipo": ACT_DOC_TYPE_META[d.docType].label, "Cliente": d.client, "Contacto": d.clientContact || "",
    "Tipo de trabajo": d.workType || "", "Responsable": d.responsible || "", "Fecha": d.date ? fdate(d.date) : "",
    "Inicio trabajo": d.startDate ? fdate(d.startDate) : "", "Fin trabajo": d.endDate ? fdate(d.endDate) : "",
    "Estado": ACT_STATUS_META[d.status].label, "Observaciones": d.observations || "", "Notas internas": d.internalNotes || "",
  }));
  const ws1 = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "N.º": "Sin documentos registrados" }]);
  ws1["!cols"] = [{ wch: 12 }, { wch: 18 }, { wch: 22 }, { wch: 20 }, { wch: 16 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 40 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws1, "Documentos");

  const summaryRows = summary.map((s) => ({ "Cliente": s.client, "Actas": s.actas, "Órdenes": s.ordenes, "Total": s.total, "Pendientes": s.pendientes, "Último documento": s.lastDate ? fdate(s.lastDate) : "" }));
  const ws2 = XLSX.utils.json_to_sheet(summaryRows.length ? summaryRows : [{ "Cliente": "Sin datos" }]);
  ws2["!cols"] = [{ wch: 26 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Resumen por cliente");

  XLSX.writeFile(wb, "Documentos - " + todayISO() + ".xlsx");
}
